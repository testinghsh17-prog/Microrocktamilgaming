<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gaming Club - by Vishnuram</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root { --bg-main:#fce4ec; --bg-panel:#fff; --bg-sidebar:#fff; --text-main:#2d3436; --text-sub:#a4b0be; --border:#f1f2f6; --accent:#ff9ff3; --danger:#ff7675; --input-bg:#f1f2f6; }
        .dark-theme { --bg-main:#2f3640; --bg-panel:#353b48; --bg-sidebar:#2f3640; --text-main:#f5f6fa; --text-sub:#7f8fa6; --border:#404654; --accent:#a29bfe; --input-bg:#404654; }
        html, body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; height: 100dvh; background: var(--bg-main); color: var(--text-main); display: flex; overflow: hidden; }
        * { box-sizing: border-box; }
        
        .owner-rgb { background: linear-gradient(90deg, #ff4757, #ffa502, #2ed573, #1e90ff, #9c88ff); background-size: 200% auto; color: #fff; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: rainbow 3s linear infinite; font-weight: 900 !important; }
        @keyframes rainbow { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }

        /* Overlays & Modals */
        .overlay { position: fixed; inset: 0; background: var(--bg-main); z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column; }
        .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 9999; display: none; align-items: center; justify-content: center; padding: 15px; }
        .modal { background: var(--bg-panel); padding: 25px; border-radius: 20px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); max-height: 90vh; overflow-y: auto; }
        .modal h2 { text-align: center; margin: 0 0 15px 0; color: var(--accent); }
        
        .input-grp { margin-bottom: 12px; width: 100%; }
        .input-grp label { font-size: 11px; color: var(--text-sub); font-weight: bold; text-transform: uppercase; }
        .inp { width: 100%; padding: 12px; border-radius: 12px; border: 2px solid var(--border); background: var(--input-bg); color: var(--text-main); font-weight: bold; outline: none; margin-top:4px;}
        .inp:focus { border-color: var(--accent); }
        .btn { width: 100%; padding: 12px; border-radius: 12px; font-weight: bold; cursor: pointer; border: none; transition: 0.2s; margin-top: 5px; }
        .btn-acc { background: var(--accent); color: #fff; } .btn-acc:hover { filter: brightness(0.9); }
        .btn-dan { background: var(--danger); color: #fff; }
        .btn-out { background: transparent; border: 2px solid var(--text-sub); color: var(--text-sub); }

        /* Layout */
        #app { display: none; width: 100%; height: 100%; }
        .sidebar { width: 300px; background: var(--bg-sidebar); display: flex; flex-direction: column; border-right: 1px solid var(--border); z-index: 100; transition: 0.3s; flex-shrink:0;}
        .main-chat { flex: 1; display: flex; flex-direction: column; background: transparent; min-width: 0; position: relative;}
        
        .header { padding: 15px 20px; background: var(--bg-panel); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-shrink:0;}
        .user-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 5px; }
        .user-card { display: flex; align-items: center; padding: 8px; border-radius: 12px; cursor: pointer; transition: 0.2s; }
        .user-card:hover { background: var(--input-bg); }
        .avatar { width: 40px; height: 40px; border-radius: 12px; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: bold; object-fit: cover; flex-shrink:0;}
        
        .msgs { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
        .msg-row { display: flex; gap: 10px; max-width: 85%; position: relative; padding: 5px; border-radius: 8px;}
        .msg-row.me { align-self: flex-end; flex-direction: row-reverse; }
        .msg-row.selected { background: rgba(255, 118, 117, 0.1); border-left: 3px solid var(--danger); }
        .msg-bubble { background: var(--input-bg); padding: 10px 15px; border-radius: 16px; border-top-left-radius: 0; font-size: 14px; word-break: break-word; }
        .msg-row.me .msg-bubble { background: var(--accent); color: #fff; border-top-left-radius: 16px; border-top-right-radius: 0; }
        .msg-name { font-weight: 900; font-size: 13px; margin-bottom: 2px; cursor:pointer;}
        .msg-time { font-size: 9px; opacity: 0.6; margin-top: 4px; text-align: right; }
        
        .msg-actions { display: none; gap: 5px; margin-top: 5px; }
        .msg-row:hover .msg-actions { display: flex; }
        .act-btn { background: var(--bg-panel); border: none; font-size: 11px; padding: 4px 8px; border-radius: 6px; cursor: pointer; font-weight: bold; color:var(--text-sub);}
        
        /* Input Bar */
        .input-bar { padding: 10px 15px; background: var(--bg-panel); display: flex; gap: 8px; align-items: center; border-top: 1px solid var(--border); flex-shrink:0;}
        .icon-btn { width: 40px; height: 40px; min-width: 40px; border-radius: 50%; background: var(--input-bg); border: none; font-size: 16px; display: flex; align-items: center; justify-content: center; cursor: pointer; color:var(--text-sub);}
        .chat-inp { flex: 1; height: 40px; border-radius: 20px; background: var(--input-bg); border: none; padding: 0 15px; color: var(--text-main); font-weight: bold; outline: none; min-width:0;}
        .send-btn { width: 40px; height: 40px; min-width: 40px; border-radius: 50%; background: var(--accent); color: #fff; border: none; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        .sys-msg { align-self: center; background: var(--input-bg); padding: 5px 12px; border-radius: 12px; font-size: 11px; font-weight: bold; color: var(--text-sub); }
        .media-item { max-width: 200px; border-radius: 12px; margin-top: 5px; cursor:pointer;}

        @media (max-width: 768px) {
            .sidebar { position: absolute; height: 100%; transform: translateX(-100%); box-shadow: 2px 0 10px rgba(0,0,0,0.2); }
            .sidebar.open { transform: translateX(0); }
            #menu-btn { display: block !important; }
            .msg-actions { display: flex; opacity: 0.8;}
        }
    </style>
</head>
<body class="dark-theme">

    <div id="loading" class="overlay" style="z-index: 9999999;">
        <h2 style="color:var(--accent);">Loading Chat...</h2>
        <p style="font-weight:bold;">Wait, you cannot send messages until loading is complete.</p>
    </div>

    <div id="stealth" class="overlay">
        <div class="modal">
            <h2>Study Portal</h2>
            <input type="password" id="pin" class="inp" placeholder="****" maxlength="4" style="text-align:center; letter-spacing:10px; font-size:20px;">
            <button class="btn btn-acc" onclick="checkPin()">Access</button>
        </div>
    </div>

    <div id="auth" class="modal-bg">
        <div class="modal">
            <h2>Gaming Club</h2>
            <div class="input-grp"><label>Gamer Tag</label><input type="text" id="uname" class="inp"></div>
            <div class="input-grp"><label>Password</label><input type="password" id="upwd" class="inp"></div>
            <button class="btn btn-acc" onclick="auth(false)">Login</button>
            <button class="btn btn-out" onclick="auth(true)">Sign Up</button>
        </div>
    </div>

    <div id="edit-profile" class="modal-bg">
        <div class="modal">
            <h2>⚙️ Settings</h2>
            <div class="input-grp" style="display:flex; gap:10px;">
                <img id="pfp-preview" src="" class="avatar">
                <button class="btn btn-out" style="margin:0;" onclick="document.getElementById('pfp-upload').click()">Change Picture</button>
            </div>
            <div class="input-grp"><label>Name Color</label><input type="color" id="p-color" class="inp" style="padding:0; height:40px;"></div>
            <div class="input-grp"><label>Roblox</label><input type="text" id="p-rb" class="inp"></div>
            <div class="input-grp"><label>Minecraft</label><input type="text" id="p-mc" class="inp"></div>
            <button class="btn btn-acc" onclick="saveProfile()">Save</button>
            <button class="btn btn-out" onclick="hide('edit-profile')">Cancel</button>
        </div>
    </div>

    <div id="user-card" class="modal-bg">
        <div class="modal">
            <div style="display:flex; align-items:center; gap:15px; margin-bottom:15px;">
                <img id="card-img" src="" class="avatar" style="width:60px; height:60px;">
                <div><h3 id="card-name" style="margin:0;">Name</h3><span id="card-role" style="font-size:12px; font-weight:bold; color:var(--text-sub);">Role</span></div>
            </div>
            <div style="background:var(--input-bg); padding:10px; border-radius:10px; margin-bottom:15px; font-size:13px; font-weight:bold;">
                <div style="display:flex; justify-content:space-between;"><span>Minecraft:</span><span id="card-mc-txt">None</span></div>
                <div style="display:flex; justify-content:space-between; margin-top:5px;"><span>Roblox:</span><span id="card-rb-txt">None</span></div>
            </div>
            <div id="card-owner-tools" style="display:none; flex-direction:column; gap:5px; background:rgba(0,0,0,0.1); padding:10px; border-radius:10px; margin-bottom:10px;">
                <div style="display:flex; gap:5px;">
                    <input type="number" id="timeout-mins" class="inp" style="margin:0; padding:8px;" placeholder="Mins">
                    <button class="btn btn-acc" style="margin:0; padding:8px;" onclick="cmd('timeout')">Timeout</button>
                </div>
                <button class="btn btn-out" style="margin:0; padding:8px;" onclick="cmd('untimeout')">Remove Timeout</button>
                <div style="display:flex; gap:5px;">
                    <button class="btn btn-acc" style="margin:0; padding:8px; background:var(--success); color:#000;" onclick="cmd('promote')">Promote</button>
                    <button class="btn btn-out" style="margin:0; padding:8px;" onclick="cmd('demote')">Demote</button>
                </div>
                <button class="btn btn-dan" style="margin:0; padding:8px;" onclick="cmd('kick')">Kick Player</button>
            </div>
            <button class="btn btn-out" onclick="hide('user-card')">Close</button>
        </div>
    </div>

    <div id="bugs" class="modal-bg">
        <div class="modal">
            <h2>🐛 Bug Report</h2>
            <textarea id="bug-txt" class="inp" rows="4" placeholder="Describe issue..."></textarea>
            <button class="btn btn-acc" onclick="sendBug()">Submit</button>
            <button class="btn btn-out" onclick="hide('bugs')">Cancel</button>
        </div>
    </div>

    <div id="app">
        <div class="sidebar" id="side">
            <div class="header">
                <h3 style="margin:0; color:var(--accent);">Gamers</h3>
                <button class="icon-btn" onclick="toggleSide()" style="display:none;" id="menu-close">✕</button>
            </div>
            <div class="user-list" id="users"></div>
            <div style="padding:15px; border-top: 1px solid var(--border); background:var(--bg-panel); display:grid; grid-template-columns:1fr 1fr; gap:8px;">
                <button class="btn btn-out" style="margin:0; padding:10px; font-size:12px;" onclick="show('bugs', true)">🐛 Report</button>
                <button class="btn btn-out" style="margin:0; padding:10px; font-size:12px;" onclick="toggleDark()">🌙 Theme</button>
                <button class="btn btn-out" style="margin:0; padding:10px; font-size:12px;" onclick="openEditProfile()">⚙️ Settings</button>
                <button class="btn btn-dan" style="margin:0; padding:10px; font-size:12px;" onclick="logout()">🚪 Logout</button>
                <button class="btn btn-dan" style="margin:0; padding:10px; font-size:12px; grid-column: span 2; display:none;" id="nuke-btn" onclick="nuke()">☢️ Wipe Database</button>
            </div>
        </div>

        <div class="main-chat">
            <div class="header">
                <button class="icon-btn" id="menu-btn" style="display:none; background:transparent;" onclick="toggleSide()">☰</button>
                <div>
                    <h3 style="margin:0;"># general</h3>
                    <div style="font-size:11px; color:var(--text-sub); font-weight:bold;">Owner: Vishnuram</div>
                </div>
                <button class="btn btn-out" style="width:auto; padding:6px 12px; margin:0; font-size:12px; color:var(--danger); border-color:var(--danger);" onclick="toggleSelect()">🗑️ Select</button>
            </div>

            <div id="select-bar" style="display:none; padding:10px; background:var(--bg-sidebar); border-bottom:1px solid var(--border); align-items:center; justify-content:space-between;">
                <span id="sel-count" style="font-weight:bold; color:var(--danger);">0 Selected</span>
                <div style="display:flex; gap:10px;">
                    <button class="btn btn-out" style="margin:0; padding:6px 12px; width:auto;" onclick="delSel(false)">Hide</button>
                    <button class="btn btn-dan" style="margin:0; padding:6px 12px; width:auto; display:none;" id="perm-del-btn" onclick="delSel(true)">Erase Forever</button>
                </div>
            </div>

            <div class="msgs" id="chat"></div>

            <div id="reply-bar" style="display:none; padding:8px 15px; background:var(--input-bg); border-top:1px solid var(--border); justify-content:space-between; font-size:12px; font-weight:bold;">
                <span style="color:var(--accent);">Replying to <span id="rep-name"></span></span>
                <span style="cursor:pointer;" onclick="hide('reply-bar'); curRep=null;">✕</span>
            </div>

            <div class="input-bar">
                <button class="icon-btn" onclick="document.getElementById('image-picker').click()">📎</button>
                <button class="icon-btn" onclick="db.ref('messages').push(genMsg('text', `🎲 Rolled ${Math.floor(Math.random()*6)+1}!`));">🎲</button>
                <input type="text" id="msg-inp" class="chat-inp" placeholder="Loading..." disabled oninput="typ()">
                <button class="send-btn" id="send-btn" onclick="send()">🎤</button>
            </div>
        </div>
    </div>

    <input type="file" id="pfp-upload" style="display:none;" accept="image/*" onchange="upl(event, 'pfp')">
    <input type="file" id="image-picker" style="display:none;" accept="image/*" onchange="upl(event, 'chat')">

    <script>
        // 🔑 FIREBASE CONFIG
        firebase.initializeApp({
            apiKey: "AIzaSyARYTP4FmIXEcCS3asAKo8xgE0h2jbzZsc",
            authDomain: "marutham-17a59.firebaseapp.com",
            databaseURL: "https://marutham-17a59-default-rtdb.firebaseio.com",
            projectId: "marutham-17a59"
        });
        const db = firebase.database();
        const $ = id => document.getElementById(id);
        const show = (id, flex=false) => $(id).style.display = flex ? 'flex' : 'block';
        const hide = id => $(id).style.display = 'none';

        let me = null, users = {}, msgs = {}, curRep = null, selMode = false, selSet = new Set(), isLoad = true, tOut = 0;
        let isRec = false, rec, chunks = [];

        // INIT & AUTH
        function checkPin() { if($('pin').value === '0000') { hide('stealth'); init(); } else $('pin').value=''; }
        function init() {
            let saved = localStorage.getItem('g_user');
            if(saved) { 
                me = JSON.parse(saved); 
                if(!me.nameColor) me.nameColor = '#ff9ff3'; 
                if(!me.pwd) { localStorage.clear(); return show('auth', true); }
                isOwner = me.name.toLowerCase().includes('vishnuram');
                boot(); 
            } else show('auth', true);
        }

        function auth(isUp) {
            const n = $(isUp ? 'regName' : 'uname').value.trim(), p = $(isUp ? 'regPwd' : 'upwd').value;
            if(!n || !p) return alert("Fill fields!");
            const k = n.toLowerCase().replace(/[^a-z0-9]/g, '');
            db.ref('accounts/'+k).once('value').then(s => {
                if(isUp) {
                    if(s.exists()) return alert("Name taken!");
                    me = { id: k, name: n, pwd: p, role: n.toLowerCase().includes('vishnuram')?'owner':'user', nameColor: '#ff9ff3', avatar: '' };
                    db.ref('accounts/'+k).set(me);
                } else {
                    if(!s.exists() || s.val().pwd !== p) return alert("Wrong info!");
                    me = s.val(); if(!me.nameColor) me.nameColor = '#ff9ff3';
                }
                localStorage.setItem('g_user', JSON.stringify(me));
                isOwner = me.role === 'owner'; boot();
            });
        }
        function switchAuthTab(t) { hide('form-login'); hide('form-signup'); show('form-'+t); }
        function logout() { localStorage.clear(); location.reload(); }

        // BOOT APP
        function boot() {
            hide('auth'); show('app', true);
            if(isOwner) { show('nuke-btn'); show('perm-del-btn'); }
            
            db.ref('accounts/'+me.id).on('value', s => { if(s.exists()) tOut = s.val().tOut || 0; });
            db.ref('users').on('value', s => { users = s.val() || {}; renderUsers(); });
            
            db.ref('messages').once('value').then(() => { 
                isLoad = false; hide('loading'); 
                $('msg-inp').disabled = false; $('msg-inp').placeholder = "Message #general..."; 
            });
            db.ref('messages').on('child_added', s => { let d = s.val(); if(d) renderMsg(d); });
            db.ref('messages').on('child_changed', s => { let d = s.val(); if(d) updateMsg(d); });
            db.ref('messages').on('child_removed', s => { let e = $(s.key); if(e) e.remove(); });

            setInterval(() => {
                if(tOut > Date.now()) { $('msg-inp').disabled = true; $('msg-inp').placeholder = `⏱️ Timeout`; }
                else if(!isLoad && $('msg-inp').disabled) { $('msg-inp').disabled = false; $('msg-inp').placeholder = "Message #general..."; }
            }, 1000);
        }

        // COMPRESSION & UPLOAD
        function upl(e, type) {
            const f = e.target.files[0]; if(!f) return;
            const r = new FileReader();
            r.onload = ev => {
                const i = new Image(); i.onload = () => {
                    const c = document.createElement('canvas'), ctx = c.getContext('2d');
                    let w = i.width, h = i.height, max = type==='pfp'?200:600;
                    if(w>h && w>max) { h*=max/w; w=max; } else if(h>max) { w*=max/h; h=max; }
                    c.width=w; c.height=h; ctx.drawImage(i,0,0,w,h);
                    let b64 = c.toDataURL('image/jpeg', 0.6);
                    if(type === 'pfp') { window.tmpPfp = b64; $('pfp-preview').src = b64; }
                    else { sendDB('img', '', null, b64); $('msg-inp').placeholder="Message #general..."; }
                }; i.src = ev.target.result;
            }; r.readAsDataURL(f);
            if(type==='chat') $('msg-inp').placeholder="Compressing...";
        }

        // PROFILE & SETTINGS
        function openEditProfile() {
            $('p-color').value = me.nameColor || '#ff9ff3';
            $('p-rb').value = me.roblox || ''; $('p-mc').value = me.minecraft || '';
            $('pfp-preview').src = me.avatar || 'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=';
            show('edit-profile', true);
        }
        function saveProfile() {
            me.nameColor = $('p-color').value; me.roblox = $('p-rb').value.trim(); me.minecraft = $('p-mc').value.trim();
            if(window.tmpPfp) me.avatar = window.tmpPfp;
            localStorage.setItem('g_user', JSON.stringify(me));
            let up = { nameColor: me.nameColor, roblox: me.roblox, minecraft: me.minecraft, avatar: me.avatar };
            db.ref('accounts/'+me.id).update(up); db.ref('users/'+me.id).update(up);
            hide('edit-profile');
        }

        // USER CARDS & COMMANDS
        let cTgt = null;
        function openCard(id) {
            if(selMode) { let cb=$('cb_'+id); if(cb){ cb.checked=!cb.checked; chk(cb, id); } return; }
            const u = users[id] || me; cTgt = id;
            $('card-name').innerText = u.name; $('card-name').className = u.name.toLowerCase().includes('vishnuram') ? 'owner-rgb' : '';
            $('card-role').innerText = u.role === 'owner' ? '👑 OWNER' : (u.role==='admin'?'🛡️ ADMIN':'🎮 GAMER');
            $('card-img').src = u.avatar || ''; $('card-img').style.display = u.avatar ? 'block' : 'none';
            $('card-mc-txt').innerText = u.minecraft || "None"; $('card-rb-txt').innerText = u.roblox || "None";
            $('card-owner-tools').style.display = (isOwner && id !== me.id) ? 'flex' : 'none';
            show('user-card', true);
        }
        function cmd(action) {
            if(!isOwner || !cTgt) return;
            if(action==='timeout') { let m=parseInt($('timeout-mins').value); if(m>0) db.ref('accounts/'+cTgt).update({tOut: Date.now()+(m*60000)}); alert("Timeout applied.");}
            if(action==='untimeout') { db.ref('accounts/'+cTgt).update({tOut: 0}); alert("Timeout removed.");}
            if(action==='promote') { db.ref('accounts/'+cTgt).update({role: 'admin'}); alert("Promoted.");}
            if(action==='demote') { db.ref('accounts/'+cTgt).update({role: 'user'}); alert("Demoted.");}
            if(action==='kick') { if(confirm("Kick?")) { db.ref('accounts/'+cTgt).remove(); db.ref('users/'+cTgt).remove(); } }
            hide('user-card');
        }

        // BUGS
        function sendBug() {
            if(!$('bug-txt').value.trim()) return;
            db.ref('bug_reports').push({ by: me.name, txt: $('bug-txt').value.trim() });
            $('bug-txt').value = ''; hide('bugs'); alert("Sent!");
        }

        // CHAT LOGIC
        function genMsg(type, txt, b64=null) { return { msgId: 'm_'+Date.now(), sender: {id: me.id, name: me.name, color: me.nameColor}, type: type, text: txt, data: b64, time: new Date().toLocaleTimeString(), isDel: false, replyTo: curRep }; }
        function send() {
            if(isLoad || tOut > Date.now()) return;
            const txt = $('msg-inp').value.trim();
            if(txt) {
                if(txt.startsWith('/alert') && (isOwner||me.role==='admin')) db.ref('messages').push(genMsg('alert', txt.substring(7)));
                else db.ref('messages').push(genMsg('text', txt));
                $('msg-inp').value = ''; typ(); curRep=null; hide('reply-bar');
            } else {
                if(!isRec) {
                    navigator.mediaDevices.getUserMedia({audio:true}).then(s => {
                        rec = new MediaRecorder(s); rec.start(); isRec=true; chunks=[];
                        $('send-btn').innerText='⏹'; $('send-btn').style.background='var(--danger)';
                        rec.ondataavailable = e => { if(e.data.size>0) chunks.push(e.data); };
                        rec.onstop = () => {
                            const b = new Blob(chunks); const r = new FileReader();
                            r.readAsDataURL(b); r.onloadend = () => db.ref('messages').push(genMsg('voice','',r.result));
                            s.getTracks().forEach(t=>t.stop());
                        };
                    }).catch(e=>alert("Mic Error!"));
                } else { rec.stop(); isRec=false; $('send-btn').innerText='🎤'; $('send-btn').style.background='var(--accent)'; }
            }
        }
        function typ() { $('send-btn').innerText = $('msg-inp').value.trim() ? '➤' : '🎤'; }
        $('msg-inp').addEventListener('keypress', e => { if(e.key === 'Enter') send(); });

        function setRep(id) {
            let m = msgs[id]; if(!m) return;
            curRep = { name: m.sender.name, text: m.type==='text'?m.text:m.type };
            $('rep-name').innerText = curRep.name; show('reply-bar', true); $('msg-inp').focus();
        }

        // MULTI SELECT
        function toggleSelect() {
            if(isLoad) return;
            selMode = !selMode;
            if(selMode) { show('select-bar', true); $('chat').classList.add('select-mode-active'); selSet.clear(); $('sel-count').innerText='0 Selected'; }
            else { hide('select-bar'); $('chat').classList.remove('select-mode-active'); document.querySelectorAll('.msg-checkbox').forEach(c=>c.checked=false); selSet.forEach(id=>{let e=$(id); if(e)e.classList.remove('selected');}); selSet.clear(); }
        }
        function chk(cb, id) {
            const r = $(id);
            if(cb.checked) { selSet.add(id); if(r) r.classList.add('selected'); } else { selSet.delete(id); if(r) r.classList.remove('selected'); }
            $('sel-count').innerText = selSet.size + ' Selected';
        }
        function delSel(perm) {
            if(selSet.size===0) return;
            if(confirm(perm?"Erase forever?":"Hide messages?")) {
                selSet.forEach(id => { if(perm) db.ref('messages/'+id).remove(); else db.ref('messages/'+id).update({isDel:true}); });
                toggleSelect();
            }
        }
        function nuke() { if(prompt("PIN to clear (2013):")==='2013') db.ref('messages').remove(); }

        // RENDER
        function renderUsers() {
            let h = '';
            Object.keys(users).forEach(id => {
                let u = users[id]; if(!u.name) return;
                let c = u.name.toLowerCase().includes('vishnuram') ? 'owner-rgb' : '';
                let a = u.avatar ? `<img src="${u.avatar}" class="avatar">` : `<div class="avatar">${u.name.charAt(0).toUpperCase()}</div>`;
                h += `<div class="user-card" onclick="openCard('${id}')">${a}<div class="msg-name ${c}" style="color:${u.nameColor||'var(--text-main)'}; margin:0;">${u.name}</div></div>`;
            });
            $('users').innerHTML = h;
        }

        function renderMsg(m) {
            msgs[m.msgId] = m;
            let c = $('chat'); let b = c.scrollHeight - c.scrollTop <= c.clientHeight + 100;
            
            if(m.type==='alert' && !m.isDel) {
                c.insertAdjacentHTML('beforeend', `<div class="sys-alert-msg" id="${m.msgId}">${isOwner?`<button class="act-btn" style="position:absolute; top:10px; right:10px;" onclick="db.ref('messages/${m.msgId}').remove()">✕</button>`:''}<div class="sys-alert-title owner-rgb">🚨 ALERT</div><div class="sys-alert-text">${m.text}</div></div>`);
                if(b) c.scrollTop = c.scrollHeight; return;
            }

            let meC = m.sender.id === me.id;
            let nc = m.sender.name.toLowerCase().includes('vishnuram') ? 'owner-rgb' : '';
            let ht = m.isDel ? '<i>Deleted</i>' : (m.type==='text' ? m.text : (m.type==='img' ? `<img src="${m.data}" class="media-item">` : `<audio controls src="${m.data}"></audio>`));
            let rep = m.replyTo && !m.isDel ? `<div class="reply-quote"><span class="msg-name">${m.replyTo.name}</span> ${m.replyTo.text}</div>` : '';
            let cb = (meC || isOwner) ? `<input type="checkbox" class="msg-checkbox" id="cb_${m.msgId}" onclick="chk(this, '${m.msgId}')">` : '';
            
            let act = `<div class="msg-actions">`;
            if(!m.isDel) act += `<button class="act-btn" onclick="setRep('${m.msgId}')">Reply</button>`;
            if(!m.isDel && (meC||isOwner)) act += `<button class="act-btn" style="color:var(--danger);" onclick="db.ref('messages/${m.msgId}').update({isDel:true})">Delete</button>`;
            if(m.isDel && (meC||isOwner)) act += `<button class="act-btn" style="color:var(--success);" onclick="db.ref('messages/${m.msgId}').update({isDel:false})">Recover</button>`;
            act += `</div>`;

            let html = `<div class="msg-row ${meC?'me':''}" id="${m.msgId}" onclick="if(selMode){let cb=$('cb_${m.msgId}'); if(cb){cb.checked=!cb.checked; chk(cb, '${m.msgId}');}}">
                ${cb}
                <div class="avatar" onclick="openCard('${m.sender.id}')">${m.sender.name.charAt(0)}</div>
                <div style="display:flex; flex-direction:column; position:relative;">
                    <div class="msg-bubble"><div class="msg-name ${nc}" style="color:${m.sender.color||'var(--text-main)'};" onclick="openCard('${m.sender.id}')">${m.sender.name}</div>${rep}<div>${ht}</div><div class="msg-time">${m.time}</div></div>
                    ${act}
                </div>
            </div>`;
            
            if(!$('cb_'+m.msgId)) c.insertAdjacentHTML('beforeend', html);
            if(b || meC) c.scrollTop = c.scrollHeight;
        }

        function updateMsg(m) { let o = $(m.msgId); if(o) { o.outerHTML = ""; renderMsg(m); } }
        function toggleDark() { document.body.classList.toggle('dark-theme'); }
        function toggleSide() { $('side').classList.toggle('open'); }
    </script>
</body>
</html>
