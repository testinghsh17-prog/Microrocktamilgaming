<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>School Hub - 7-Marutham</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        /* CORE SETUP & CSS VARIABLES */
        :root {
            --bg-panel: rgba(255, 255, 255, 0.85);
            --bg-sidebar: rgba(248, 249, 250, 0.85);
            --text-main: #2f3640;
            --text-sub: #57606f;
            --border-color: rgba(220, 221, 225, 0.5);
            --bubble-other: rgba(255, 255, 255, 0.95);
            --bubble-me: rgba(220, 248, 198, 0.95);
            --bubble-dm: rgba(243, 229, 245, 0.95);
            --bubble-dm-me: rgba(245, 238, 255, 0.95);
            --input-bg: rgba(240, 242, 245, 0.8);
            --input-field: rgba(255, 255, 255, 0.9);
            --glass-header: rgba(255, 255, 255, 0.75);
            --chat-overlay: rgba(255, 255, 255, 0.15);
        }

        .dark-theme {
            --bg-panel: rgba(30, 39, 46, 0.85);
            --bg-sidebar: rgba(47, 54, 64, 0.85);
            --text-main: #f5f6fa;
            --text-sub: #dcdde1;
            --border-color: rgba(72, 84, 96, 0.5);
            --bubble-other: rgba(47, 54, 64, 0.95);
            --bubble-me: rgba(5, 196, 107, 0.95);
            --bubble-dm: rgba(142, 68, 173, 0.95);
            --bubble-dm-me: rgba(155, 89, 182, 0.95);
            --input-bg: rgba(30, 39, 46, 0.8);
            --input-field: rgba(47, 54, 64, 0.9);
            --glass-header: rgba(30, 39, 46, 0.75);
            --chat-overlay: rgba(0, 0, 0, 0.4);
        }

        html, body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; background: #05050a; color: var(--text-main); position: fixed; inset: 0; display: flex; overflow: hidden; box-sizing: border-box; }
        * { box-sizing: border-box; }
        
        /* 🧊 4K MOVING BLOCKS BACKGROUND 🧊 */
        .ultimate-4k-bg {
            position: fixed; inset: 0; z-index: -10; background: radial-gradient(circle at center, #1a1c29 0%, #05050a 100%); overflow: hidden;
            transition: background 0.5s ease;
        }
        .dark-theme .ultimate-4k-bg { background: radial-gradient(circle at center, #0a0c14 0%, #000000 100%); }
        
        .moving-block {
            position: absolute; bottom: -20vh;
            background: rgba(52, 152, 219, 0.03);
            border: 1px solid rgba(52, 152, 219, 0.15);
            box-shadow: 0 0 30px rgba(52, 152, 219, 0.05), inset 0 0 20px rgba(255,255,255,0.02);
            backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
            border-radius: 16px;
            animation: floatBlock linear infinite;
        }
        .dark-theme .moving-block { border-color: rgba(0, 240, 255, 0.15); box-shadow: 0 0 30px rgba(0, 240, 255, 0.05); }

        @keyframes floatBlock {
            0% { transform: translateY(0) rotateX(0deg) rotateY(0deg) rotateZ(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-130vh) rotateX(360deg) rotateY(180deg) rotateZ(360deg); opacity: 0; }
        }

        /* MODALS & AUTH TABS */
        .modal-screen { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); display: flex; align-items: center; justify-content: center; z-index: 3000; }
        .modal-box { background: var(--bg-panel); color: var(--text-main); padding: 35px; border-radius: 20px; width: 360px; box-shadow: 0 25px 50px rgba(0,0,0,0.5); display: flex; flex-direction: column; max-height: 90vh; overflow-y: auto; border: 1px solid var(--border-color);}
        .modal-box h2 { margin-top: 0; text-align: center; margin-bottom: 20px; font-weight: 800; letter-spacing: -0.5px;}
        
        .tab-container { display: flex; gap: 10px; margin-bottom: 20px; background: rgba(0,0,0,0.05); padding: 5px; border-radius: 12px;}
        .tab { flex: 1; padding: 10px; border: none; background: transparent; color: var(--text-sub); border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 14px;}
        .tab.active { background: #3498db; color: white; box-shadow: 0 4px 10px rgba(52,152,219,0.3);}

        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 11px; color: var(--text-sub); margin-bottom: 5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px;}
        .modal-box input, .modal-box select { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid var(--border-color); font-size: 14px; outline: none; background: var(--input-field); color: var(--text-main); transition: 0.2s; }
        .modal-box input:focus { border-color: #3498db; box-shadow: 0 0 0 4px rgba(52, 152, 219, 0.15); }
        .modal-box button.primary { background: linear-gradient(135deg, #3498db, #2980b9); color: white; border: none; font-weight: bold; cursor: pointer; padding: 15px; border-radius: 10px; font-size: 16px; margin-top: 10px; transition: 0.3s; box-shadow: 0 4px 15px rgba(52,152,219,0.4);}
        .modal-box button.primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(52,152,219,0.6); }
        .modal-box button.secondary { background: transparent; color: #e74c3c; border: 2px solid rgba(231,76,60,0.3); font-weight: bold; cursor: pointer; padding: 12px; border-radius: 10px; margin-top: 10px; transition: 0.2s;}
        .modal-box button.secondary:hover { background: rgba(231,76,60,0.1); border-color: #e74c3c; }

        /* ACTION MENU MODAL */
        .action-menu-btn { width: 100%; padding: 14px; margin-bottom: 8px; border: none; border-radius: 12px; font-weight: 800; font-size: 14px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 10px; background: var(--input-bg); color: var(--text-main); }
        .action-menu-btn:hover { background: var(--border-color); transform: translateX(5px); }
        .action-menu-btn.danger { color: #e74c3c; background: rgba(231, 76, 60, 0.1); }
        .action-menu-btn.danger:hover { background: rgba(231, 76, 60, 0.2); }
        .action-menu-btn.success { color: #05c46b; background: rgba(5, 196, 107, 0.1); }
        
        /* THIS IS THE FIX: Animations are now safely inside the <style> tags */
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        /* WHATSAPP STATUS VIEWER */
        #status-viewer { position: fixed; inset: 0; background: #000; z-index: 5000; display: none; flex-direction: column; }
        .status-progress-container { display: flex; gap: 4px; padding: 15px 10px; position: absolute; top: 0; left: 0; right: 0; z-index: 5001; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); }
        .status-progress-bar { height: 3px; background: rgba(255,255,255,0.3); flex: 1; border-radius: 3px; overflow: hidden; }
        .status-progress-fill { height: 100%; background: #fff; width: 0%; transition: width 0.1s linear; }
        .status-header { position: absolute; top: 30px; left: 15px; right: 15px; display: flex; justify-content: space-between; align-items: center; z-index: 5001; color: white;}
        .status-user-info { display: flex; align-items: center; gap: 10px; font-weight: bold; font-size: 16px; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
        .status-close { background: rgba(255,255,255,0.2); border: none; color: white; width: 40px; height: 40px; border-radius: 50%; font-size: 20px; cursor: pointer; backdrop-filter: blur(5px); }
        #status-image { width: 100%; height: 100%; object-fit: contain; }
        #status-delete-btn { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(231, 76, 60, 0.9); color: white; border: none; padding: 12px 25px; border-radius: 25px; font-weight: bold; font-size: 16px; cursor: pointer; z-index: 5001; display: none; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }

        /* APP LAYOUT */
        #app-screen { display: none; width: 100%; height: 100%; flex-direction: row; }
        .sidebar { width: 340px; background: var(--bg-panel); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); display: flex; flex-direction: column; border-right: 1px solid var(--border-color); z-index: 1000; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), background 0.3s; }
        .sidebar-header { padding: 20px; background: transparent; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .sidebar-title { font-weight: 800; font-size: 20px; letter-spacing: -0.5px;}
        .header-actions { display: flex; align-items: center; gap: 8px; }
        .edit-btn { background: #3498db; color: white; border: none; padding: 8px 14px; border-radius: 20px; cursor: pointer; font-size: 12px; font-weight: bold; transition: 0.2s; box-shadow: 0 2px 8px rgba(52,152,219,0.3);}
        .status-add-btn { background: #05c46b; color: white; border: none; padding: 8px 14px; border-radius: 20px; cursor: pointer; font-size: 12px; font-weight: bold; transition: 0.2s; box-shadow: 0 2px 8px rgba(5, 196, 107, 0.3);}
        
        .yt-promo { padding: 15px 20px; background: rgba(255,0,0,0.05); border-bottom: 1px solid var(--border-color); text-align: center; }
        .yt-promo p { margin: 0 0 8px 0; font-size: 11px; font-weight: 800; color: #e74c3c; letter-spacing: 1px; }
        .yt-btn { display: block; width: 100%; background: linear-gradient(135deg, #ff0000, #cc0000); color: white; text-decoration: none; padding: 12px; border-radius: 10px; font-weight: bold; font-size: 13px; transition: 0.3s; box-shadow: 0 4px 15px rgba(255, 0, 0, 0.3); }

        .user-list { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px;}
        .user-item { display: flex; align-items: center; padding: 12px; border-radius: 12px; background: rgba(0,0,0,0.03); border: 1px solid transparent; transition: 0.2s; cursor:pointer;}
        .dark-theme .user-item { background: rgba(255,255,255,0.03); }
        .user-item:hover { transform: translateX(5px); background: var(--bg-sidebar); border-color: var(--border-color); box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        
        /* AVATAR SYSTEM & WHATSAPP RINGS */
        .avatar-wrap { position: relative; margin-right: 15px; }
        .avatar { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, #3498db, #2980b9); color: white; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; text-transform: uppercase; object-fit: cover; border: 3px solid transparent;}
        
        .avatar.has-status { border-color: #05c46b; padding: 2px; background-clip: content-box; animation: pulseRing 2s infinite; cursor: pointer;}
        @keyframes pulseRing { 0% { box-shadow: 0 0 0 0 rgba(5, 196, 107, 0.4); } 70% { box-shadow: 0 0 0 8px rgba(5, 196, 107, 0); } 100% { box-shadow: 0 0 0 0 rgba(5, 196, 107, 0); } }

        .status-dot-abs { position: absolute; bottom: 0; right: 0; width: 14px; height: 14px; border-radius: 50%; border: 3px solid var(--bg-panel); }
        .status-dot-abs.online { background: #2ecc71; }
        .status-dot-abs.offline { background: #e74c3c; }

        .user-details { flex: 1; min-width: 0; }
        .name-text { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 5px; margin-bottom: 2px;}
        .status-indicator { font-size: 11px; font-weight: 600; color: var(--text-sub); }

        /* CHAT SECTION */
        .chat-section { flex: 1; display: flex; flex-direction: column; position: relative; width: 100%; background: var(--chat-overlay); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); transition: background 0.3s;}
        
        .chat-header { padding: 15px 25px; background: var(--glass-header); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); z-index: 10;}
        .menu-btn { display: none; font-size: 24px; cursor: pointer; color: var(--text-main); background: rgba(0,0,0,0.05); width: 40px; height: 40px; border-radius: 10px; align-items: center; justify-content: center;}
        
        .header-info { flex: 1; display: flex; justify-content: space-between; align-items: center; }
        .header-title { font-weight: 800; font-size: 18px; display: flex; align-items: center; gap: 8px; letter-spacing: -0.5px;}
        .header-subtitle { font-size: 12px; color: #3498db; font-weight: 700; margin-top: 2px; }
        
        .status-pill { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
        #conn-status { font-size: 10px; padding: 4px 10px; border-radius: 12px; font-weight: 800; background: #f39c12; color: white; letter-spacing: 0.5px; text-transform: uppercase;}
        #online-counter { font-size: 11px; font-weight: 700; color: var(--text-main); background: var(--input-bg); padding: 4px 10px; border-radius: 12px; border: 1px solid var(--border-color);}

        .messages-container { flex: 1; padding: 25px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth; }
        .sys-msg { align-self: center; background: var(--glass-header); color: var(--text-main); padding: 8px 16px; border-radius: 20px; font-size: 11px; font-weight: 700; margin: 10px 0; text-align: center; border: 1px solid var(--border-color); box-shadow: 0 4px 15px rgba(0,0,0,0.05);}

        /* BUBBLES & ROLES */
        .msg-bubble { background: var(--bubble-other); padding: 14px 18px; border-radius: 20px; max-width: 80%; align-self: flex-start; box-shadow: 0 8px 25px rgba(0,0,0,0.05); position: relative; border-top-left-radius: 4px; transition: background 0.3s; border: 1px solid rgba(255,255,255,0.1);}
        .msg-bubble.me { background: var(--bubble-me); align-self: flex-end; border-top-left-radius: 20px; border-top-right-radius: 4px; color: var(--text-main); }
        .dark-theme .msg-bubble.me { color: white; } 
        .msg-bubble.me.owner-bubble { background: linear-gradient(135deg, #ffeaa7, #fdcb6e); border: 1px solid #f1c40f; color: #d35400;}
        
        .msg-bubble.dm-bubble { background: var(--bubble-dm); border: 2px dashed #9b59b6; color: white;}
        .msg-bubble.dm-bubble.me { background: var(--bubble-dm-me); border: 2px dashed #8e44ad; color: var(--text-main);}
        .dark-theme .msg-bubble.dm-bubble.me { color: white; }

        .msg-sender { font-size: 12px; font-weight: 800; color: var(--text-sub); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
        .sender-avatar-small { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; background: #3498db; color:white; display:flex; align-items:center; justify-content:center; font-size:11px; text-transform: uppercase; cursor:pointer; border: 2px solid transparent;}
        .sender-avatar-small.has-status { border-color: #05c46b; padding: 1px; background-clip: content-box;}

        .role-tag { font-size: 9px; padding: 3px 8px; border-radius: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px;}
        .role-tag.owner { background: #ffeaa7; color: #d35400; border: 1px solid #f1c40f; }
        .role-tag.admin { background: #81ecec; color: #00b894; border: 1px solid #55efc4; }

        .msg-text { font-size: 15px; line-height: 1.5; word-wrap: break-word; font-weight: 500;}
        .msg-time { font-size: 10px; color: var(--text-sub); text-align: right; margin-top: 8px; opacity: 0.8; font-weight: 600;}
        
        .deleted-text { font-style: italic; color: var(--text-sub); font-size: 14px; display: flex; align-items: center; gap: 5px;}
        .delete-btn { position: absolute; top: 10px; right: 10px; background: rgba(231, 76, 60, 0.1); border: none; color: #e74c3c; font-size: 14px; cursor: pointer; border-radius: 50%; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .delete-btn:hover { background: #e74c3c; color: white; transform: scale(1.1);}
        
        .msg-image { margin-top: 8px; cursor: pointer; border-radius: 12px; overflow: hidden;}
        .msg-image img { max-width: 250px; max-height: 300px; display: block; object-fit: cover; }
        
        #scroll-bottom-btn { position: absolute; bottom: 90px; right: 25px; background: #3498db; color: white; border: none; border-radius: 50%; width: 45px; height: 45px; font-size: 20px; box-shadow: 0 8px 25px rgba(52,152,219,0.4); cursor: pointer; display: none; align-items: center; justify-content: center; z-index: 2000; transition: 0.3s;}

        /* INPUT AREA */
        .input-bar { padding: 15px 25px; background: var(--glass-header); border-top: 1px solid var(--border-color); display: flex; gap: 12px; align-items: center; padding-bottom: max(15px, env(safe-area-inset-bottom)); z-index: 100; transition: background 0.3s; box-shadow: 0 -4px 20px rgba(0,0,0,0.03);}
        .action-btn { background: var(--input-bg); color: var(--text-sub); border: 1px solid var(--border-color); font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 45px; height: 45px; border-radius: 50%; transition: 0.2s; }
        .input-bar input { flex: 1; padding: 15px 20px; border-radius: 25px; border: 1px solid var(--border-color); outline: none; font-size: 15px; font-weight: 500; background: var(--input-field); color: var(--text-main); }
        .input-bar input:disabled { background: var(--bg-sidebar); cursor: not-allowed; opacity: 0.8;}
        
        .send-btn { background: linear-gradient(135deg, #3498db, #2980b9); color: white; border: none; border-radius: 50%; width: 50px; height: 50px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 20px; transition: 0.3s; box-shadow: 0 6px 15px rgba(52, 152, 219, 0.4); }

        @media (max-width: 768px) {
            .sidebar { position: absolute; top: 0; left: 0; height: 100dvh; transform: translateX(-100%); width: 85vw; max-width: 340px; box-shadow: 10px 0 30px rgba(0,0,0,0.5); z-index: 2000; }
            .sidebar.open { transform: translateX(0); }
            .menu-btn { display: flex; }
            .close-sidebar-btn { display: flex; }
        }

        #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none; align-items: center; justify-content: center; z-index: 4000; flex-direction: column; }
        #lightbox.active { display: flex; }
        #lightbox img { max-width: 95%; max-height: 80%; border-radius: 12px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
        .lb-actions { display: flex; gap: 20px; margin-top: 25px; }
        .lb-btn { padding: 12px 30px; color: white; border: none; border-radius: 30px; font-weight: bold; cursor: pointer; text-decoration: none; font-size: 15px; transition: 0.2s;}
        
        .theme-toggle-btn { width: 100%; padding: 12px; background: var(--input-bg); color: var(--text-main); border: 1px solid var(--border-color); border-radius: 12px; font-weight: 800; font-size: 13px; cursor: pointer; margin-top: 10px;}
    </style>
</head>
<body>

    <div id="blocks-bg" class="ultimate-4k-bg"></div>

    <div id="lightbox">
        <img id="lightbox-img" src="">
        <div class="lb-actions">
            <a id="lb-download" href="" download="" class="lb-btn" style="background: #2ecc71;">⬇ Download HD</a>
            <button onclick="document.getElementById('lightbox').classList.remove('active')" class="lb-btn" style="background: #e74c3c;">✕ Close</button>
        </div>
    </div>

    <input type="file" id="image-picker" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
    <input type="file" id="status-uploader" accept="image/*" style="display: none;" onchange="handleStatusUpload(event)">

    <div id="login-screen" class="modal-screen">
        <div class="modal-box">
            <h2>7-Marutham Hub</h2>
            <div class="tab-container">
                <button id="tab-login" class="tab active" onclick="switchAuthTab('login')">Login</button>
                <button id="tab-signup" class="tab" onclick="switchAuthTab('signup')">Sign Up</button>
            </div>
            <div id="form-login">
                <div class="input-group"><label>Username</label><input type="text" id="logName" placeholder="Enter your username"></div>
                <div class="input-group"><label>Password</label><input type="password" id="logPwd" placeholder="Enter your password"></div>
                <button class="primary" style="width:100%" onclick="doLogin()">Secure Login</button>
            </div>
            <div id="form-signup" style="display:none;">
                <div class="input-group"><label>New Username</label><input type="text" id="regName" placeholder="Create a username"></div>
                <div class="input-group"><label>Create Password</label><input type="password" id="regPwd" placeholder="Create a password"></div>
                <div class="input-group"><label>Gender</label><select id="regGender"><option>Male</option><option>Female</option></select></div>
                <div class="input-group"><label>Date of Birth</label><input type="text" id="regDob" placeholder="e.g. 15/08/2005"></div>
                <button class="primary" style="width:100%; background: linear-gradient(135deg, #2ecc71, #27ae60);" onclick="doSignUp()">Create Account</button>
            </div>
            <div class="credits">Made by Vishnuram and Prasanth</div>
        </div>
    </div>

    <div id="edit-screen" class="modal-screen" style="display: none;">
        <div class="modal-box">
            <h2>Edit Profile</h2>
            <div class="input-group">
                <label>Profile Picture</label>
                <div style="display:flex; align-items:center; gap:15px; background:var(--input-bg); padding:10px; border-radius:12px; border:1px solid var(--border-color);">
                    <img id="avatar-preview" src="" style="width:60px; height:60px; border-radius:50%; object-fit:cover; background:#3498db;">
                    <button class="primary" style="margin-top:0; padding:10px 15px; font-size:13px; flex:1;" onclick="document.getElementById('avatar-upload').click()">📷 Choose Image</button>
                    <input type="file" id="avatar-upload" accept="image/*" style="display:none;" onchange="handleAvatarSelection(event)">
                </div>
            </div>
            <div class="input-group"><label>Gender</label><select id="editGender"><option>Male</option><option>Female</option></select></div>
            <div class="input-group"><label>Date of Birth</label><input type="text" id="editDob" placeholder="e.g. 15/08/2005"></div>
            <button class="primary" onclick="saveProfile()">Save Changes</button>
            <button class="secondary" style="border-color: #f39c12; color: #f39c12;" onclick="logoutApp()">🚪 Log Out Safely</button>
            <button class="secondary" style="border-color: #c0392b; color: #c0392b;" onclick="deleteMyAccount()">🚨 Delete My Account</button>
            <button class="secondary" style="border:none; color:var(--text-sub);" onclick="document.getElementById('edit-screen').style.display='none'">Cancel</button>
        </div>
    </div>

    <div id="user-action-modal" class="modal-screen" style="display: none; align-items: flex-end; padding-bottom: 20px;">
        <div class="modal-box" style="width: 100%; max-width: 400px; border-radius: 25px; padding: 25px; animation: slideUp 0.3s ease-out;">

        // --- STATUS & AVATAR ENGINE ---
        function compressImage(file, maxRes, callback) {
            const reader = new FileReader();
            reader.onload = function(evt) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
                    let w = img.width, h = img.height; 
                    if(w > h) { if(w > maxRes) { h *= maxRes/w; w = maxRes; } } 
                    else { if(h > maxRes) { w *= maxRes/h; h = maxRes; } }
                    canvas.width = w; canvas.height = h; 
                    ctx.drawImage(img, 0, 0, w, h);
                    callback(canvas.toDataURL('image/jpeg', 0.8));
                };
                img.src = evt.target.result;
            };
            reader.readAsDataURL(file);
        }

        function handleAvatarSelection(e) {

        function startApp() {

                if (snap.val() === true) {
                    document.getElementById('conn-status').innerText = '🟢 Connected'; document.getElementById('conn-status').style.background = '#2ecc71';
                    myStatusRef.onDisconnect().update({ online: false, lastSeen: firebase.database.ServerValue.TIMESTAMP });

                } else {
                    document.getElementById('conn-status').innerText = '🔴 Reconnecting'; document.getElementById('conn-status').style.background = '#e74c3c';

            });

            db.ref('settings/chatLocked').on('value', (snap) => {
                window.chatLocked = snap.val() === true;
                const lockBtn = document.getElementById('lock-chat-btn'); const lockIcon = document.getElementById('chat-lock-icon');

                checkInputStatus();
            });

            // Status Listener
            db.ref('statuses').on('value', (snap) => {
                const now = Date.now();
                window.allStatuses = {};
                let raw = snap.val() || {};
                for(let id in raw) {
                    if(now - raw[id].timestamp < 86400000) window.allStatuses[id] = raw[id]; 
                    else db.ref('statuses/' + id).remove(); 
                }
                renderUserList(); 
            });

            db.ref('accounts/' + myProfile.id).on('value', (snap) => {
                if(isAppReady && !snap.exists()) {
                    myStatusRef.onDisconnect().cancel(); localStorage.clear(); alert("🚨 Account permanently deleted."); window.location.reload();
                } else if (snap.exists()) {
                    let data = snap.val(); myTimeoutTime = data.timeoutUntil || 0; checkInputStatus();
                }
                isAppReady = true;
            });

            db.ref('users').on('value', (snapshot) => {
                classmates = snapshot.val() || {};
                let meData = classmates[myProfile.id];
                isAdmin = meData && meData.role === 'admin';
                myProfile.role = meData ? meData.role : 'user'; 
                updateHeaderBadge(); renderUserList();

            db.ref('messages').on('child_removed', (snapshot) => { const el = document.getElementById(snapshot.key); if (el) el.remove(); });

            db.ref('typing').on('value', (snapshot) => {
                const typingData = snapshot.val() || {}; let typers = [];

                if(typers.length > 0) indicator.innerText = typers.join(', ') + (typers.length > 1 ? " are typing..." : " is typing...");
                else indicator.innerText = "";
            });
        }

        function renderUserList() {
            const container = document.getElementById('users-container'); container.innerHTML = '';

            const sortedIds = Object.keys(classmates).sort((a, b) => {

                if(classmates[a].online && !classmates[b].online) return -1;
                if(!classmates[a].online && classmates[b].online) return 1;
                return classmates[b].lastSeen - classmates[a].lastSeen;
            });

            sortedIds.forEach(id => {
                const u = classmates[id]; const isMe = id === myProfile.id;
                const displayName = isMe ? `${u.name} (You)` : u.name;
                const initial = u.name.charAt(0).toUpperCase();

                const statusColor = u.online ? 'online' : 'offline';
                let hasStatus = window.allStatuses[id] ? 'has-status' : '';
                
                let avatarHTML = u.avatar && u.avatar.startsWith('data:image') 
                    ? `<img src="${u.avatar}" class="avatar ${hasStatus}">` 
                    : `<div class="avatar ${hasStatus}">${initial}</div>`;

                let roleBadge = u.name.toLowerCase().includes('vishnuram') ? '👑 Owner' : (u.role === 'admin' ? '🛡️ Admin' : '');
                if (roleBadge) roleBadge = `<span style="font-size:11px; margin-left:5px;">${roleBadge}</span>`;
                
                let timeoutBadge = (u.timeoutUntil && u.timeoutUntil > Date.now()) ? `<span style="color:#e74c3c; font-size:10px; margin-left:5px;">⏱️ Muted</span>` : '';
                
                let clickAction = isMe ? (hasStatus ? `onclick="openStatus('${id}')"` : '') : `onclick="openUserActions('${id}')"`;

                container.innerHTML += `
                    <div class="user-item" ${clickAction}>
                        <div class="avatar-wrap">
                            ${avatarHTML}
                            <div class="status-dot-abs ${statusColor}"></div>
                        </div>
                        <div class="user-details">
                            <div class="name-text">${displayName} ${roleBadge}</div>
                            <div class="status-indicator">${u.online ? 'Online' : 'Offline'} ${timeoutBadge}</div>
                        </div>
                    </div>
                `;
            });
        }

        function getIST() { return new Date().toLocaleTimeString('en-IN', { hour: 'numeric', minute: 'numeric', hour12: true, timeZone: 'Asia/Kolkata' }); }

        let typingTimeout = null;
        function handleTypingInput() {
            const text = document.getElementById('chatInput').value.trim(); const btn = document.getElementById('action-btn');
            db.ref('typing/' + myProfile.id).set(text.length > 0 && !text.startsWith('/'));
            if(typingTimeout) clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => { db.ref('typing/' + myProfile.id).set(false); }, 3000);
            if (text) { btn.innerText = '➤'; btn.style.background = '#3498db'; } 
            else { btn.innerText = '🎤'; btn.style.background = 'linear-gradient(135deg, #3498db, #2980b9)'; }
        }

        function handleActionClick() {
            if (myTimeoutTime > Date.now()) return alert("⏱️ You are in timeout.");
            if(window.chatLocked && !isOwner && !isAdmin) return alert("🔒 Chat is locked.");

            const text = document.getElementById('chatInput').value.trim();
            if (text) {
                if(text.startsWith('/')) {
                    let parts = text.split(' '); let cmd = parts[0].toLowerCase(); let arg = text.substring(cmd.length).trim();
                    if(cmd === '/alert') { if(!isOwner && !isAdmin) return; sendMsgToDB('alert', arg); }
                    else if(cmd === '/dm') {
                        let spaceIdx = arg.indexOf(' '); if(spaceIdx === -1) return alert("⚠️ Usage: /dm [name] [msg]");
                        let t = arg.substring(0, spaceIdx); let m = arg.substring(spaceIdx + 1);
                        let fid = findUserByName(t); if(fid) sendMsgToDB('dm', m, fid); else alert("❌ Not found.");
                    }
                    else if(cmd === '/clear') { document.getElementById('messages').innerHTML = '<div class="sys-msg">🧹 Screen cleared.</div>'; }
                    else if(cmd === '/shrug') { sendMsgToDB('text', '¯\\_(ツ)_/¯'); }
                    else if(cmd === '/tableflip') { sendMsgToDB('text', '(╯°□°)╯︵ ┻━┻'); }
                    document.getElementById('chatInput').value = ''; db.ref('typing/' + myProfile.id).set(false); handleTypingInput();
                    return; 
                }
                sendMsgToDB('text', text); document.getElementById('chatInput').value = ''; db.ref('typing/' + myProfile.id).set(false); handleTypingInput(); 
            } else { toggleVoiceRecord(); }
        }

        function sendMsgToDB(msgType, msgContent, receiverId = null) {
            const msgId = 'msg_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
            let senderData = { ...myProfile };
            db.ref('messages/' + msgId).set({ msgId: msgId, sender: senderData, type: msgType, text: msgContent, data: null, receiverId: receiverId, isDeleted: false, time: getIST(), timestamp: firebase.database.ServerValue.TIMESTAMP });
        }

        document.getElementById('chatInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') handleActionClick(); });
        function deleteMessage(msgId) { if(confirm("Hide?")) db.ref('messages/' + msgId).update({ isDeleted: true }); }
        function recoverMessage(msgId) { if(confirm("Recover?")) db.ref('messages/' + msgId).update({ isDeleted: false }); }
        function hardDeleteMessage(msgId) { if(confirm("🔥 ERASE?")) db.ref('messages/' + msgId).remove(); }

        function getRoleBadge(s) {
            if(s.name.toLowerCase().includes('vishnuram')) return '<span class="role-tag owner">👑 Owner</span>';
            if(s.role === 'admin') return '<span class="role-tag admin">🛡️ Admin</span>'; return '';
        }

        function createMessageHTML(payload) {
            if(payload.type === 'alert' && !payload.isDeleted) {
                const canDelete = isOwner || isAdmin;
                const delBtn = canDelete ? `<button class="delete-btn" onclick="hardDeleteMessage('${payload.msgId}')">🗑️</button>` : '';
                return `<div class="sys-alert-msg" id="${payload.msgId}" style="position:relative;">${delBtn}🚨 ANNOUNCEMENT:<br>${payload.text}</div>`;
            }

            const isMe = payload.sender.id === myProfile.id;
            let bodyHtml = '';
            
            if(payload.isDeleted) {
                bodyHtml = '<span class="deleted-text">🚫 Deleted</span>';
                if(isOwner || isAdmin) bodyHtml += ` <button onclick="recoverMessage('${payload.msgId}')" style="background:#2ecc71; color:white; border:none; border-radius:4px; font-size:11px; font-weight:bold; cursor:pointer; padding:4px 8px; margin-left:10px;">♻️</button>`;
                if(isOwner) bodyHtml += ` <button onclick="hardDeleteMessage('${payload.msgId}')" style="background:#c0392b; color:white; border:none; border-radius:4px; font-size:11px; font-weight:bold; cursor:pointer; padding:4px 8px; margin-left:5px;">🔥</button>`;
            } else {
                if(payload.type === 'text' || payload.type === 'dm') {
                    bodyHtml = payload.text.replace(/(https?:\/\/[^\s]+)/g, url => `<a href="${url}" target="_blank">${url}</a>`);
                    if(payload.type === 'dm') {
                        let dmLabel = isMe ? `To: Private` : `From: ${payload.sender.name}`;
                        bodyHtml = `<div style="font-size:10px; color:#9b59b6; font-weight:800; margin-bottom:6px; letter-spacing:0.5px; text-transform:uppercase;">🕵️ DM ${dmLabel}</div>` + bodyHtml;
                    }
                } else if (payload.type === 'image') {
                    bodyHtml = `<div class="msg-image" onclick="openLightbox('${payload.data}')"><img src="${payload.data}"></div>`;
                } else if (payload.type === 'voice') {
                    bodyHtml = `<audio controls src="${payload.data}"></audio>`;
                }
            }

            const canDelete = isMe || isOwner || isAdmin;
            const deleteBtnHtml = (canDelete && !payload.isDeleted) ? `<button class="delete-btn" onclick="deleteMessage('${payload.msgId}')">🗑️</button>` : '';
            
            let bubbleClass = `msg-bubble ${isMe ? 'me' : ''}`;
            if(isMe && isOwner) bubbleClass += " owner-bubble"; 
            if(payload.type === 'dm') bubbleClass += " dm-bubble";
            
            // AVATAR IN CHAT BUBBLE
            let senderAvatarHTML = "";
            let avatarSrc = payload.sender.avatar && payload.sender.avatar.startsWith('data:image') ? payload.sender.avatar : "";
            let clickAttr = isMe ? '' : `onclick="openUserActions('${payload.sender.id}')"`;
            let hasStatusClass = window.allStatuses[payload.sender.id] ? 'has-status' : '';
            
            if(avatarSrc) {
                senderAvatarHTML = `<img src="${avatarSrc}" class="sender-avatar-small ${hasStatusClass}" ${clickAttr}>`;
            } else {
                senderAvatarHTML = `<div class="sender-avatar-small ${hasStatusClass}" ${clickAttr}>${payload.sender.name.charAt(0).toUpperCase()}</div>`;
            }

            let senderHTML = "";
            if(isMe) {
                senderHTML = `<div class="msg-sender" style="justify-content:flex-end;">${payload.sender.name} ${getRoleBadge(payload.sender)} ${senderAvatarHTML}</div>`;
            } else {
                senderHTML = `<div class="msg-sender">${senderAvatarHTML} ${payload.sender.name} ${getRoleBadge(payload.sender)}</div>`;
            }

            return `
                <div class="${bubbleClass}" id="${payload.msgId}" style="position:relative; ${(!isMe && (isOwner || isAdmin)) ? 'padding-right: 35px;' : ''}">
                    ${deleteBtnHtml}
                    ${senderHTML}
                    <div class="msg-text">${bodyHtml}</div>
                    <div class="msg-time">${payload.time}</div>
                </div>
            `;
        }

        function renderMessage(payload) {
            if(payload.receiverId) { if(payload.sender.id !== myProfile.id && payload.receiverId !== myProfile.id && !isOwner) return; }
            const container = document.getElementById('messages');
            const isAtBottom = container.scrollHeight - container.scrollTop <= container.clientHeight + 100;
            if (!document.getElementById(payload.msgId)) {
                container.insertAdjacentHTML('beforeend', createMessageHTML(payload));
                if (isAtBottom || payload.sender.id === myProfile.id) container.scrollTop = container.scrollHeight;
            }
        }

        function updateMessageOnScreen(data) { let oldBubble = document.getElementById(data.msgId); if(oldBubble) oldBubble.outerHTML = createMessageHTML(data); }

        function handleImageUpload(e) {
            if (myTimeoutTime > Date.now()) return alert("⏱️ You are in timeout.");
            if(window.chatLocked && !isOwner && !isAdmin) return alert("🔒 Chat is locked.");
            if(!e.target.files[0]) return;
            compressImage(e.target.files[0], 800, (base64) => {
                const msgId = 'msg_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
                db.ref('messages/' + msgId).set({ msgId: msgId, sender: myProfile, type: 'image', text: '', data: base64, isDeleted: false, time: getIST(), timestamp: firebase.database.ServerValue.TIMESTAMP });
            });
            e.target.value = '';
        }

        let mediaRecorder; let audioChunks = []; let isRecording = false;
        function toggleVoiceRecord() {
            if (myTimeoutTime > Date.now()) return;
            if(window.chatLocked && !isOwner && !isAdmin) return;
            const btn = document.getElementById('action-btn');
            if(!isRecording) {
                navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                    mediaRecorder = new MediaRecorder(stream); mediaRecorder.start(); isRecording = true; 
                    btn.classList.add('recording'); btn.innerText = '⏹'; audioChunks = [];
                    mediaRecorder.addEventListener("dataavailable", e => audioChunks.push(e.data));
                    mediaRecorder.addEventListener("stop", () => {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            const msgId = 'msg_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
                            db.ref('messages/' + msgId).set({ msgId: msgId, sender: myProfile, type: 'voice', text: '', data: e.target.result, isDeleted: false, time: getIST(), timestamp: firebase.database.ServerValue.TIMESTAMP });
                        };
                        reader.readAsDataURL(new Blob(audioChunks, { type: "audio/ogg" }));
                        stream.getTracks().forEach(t => t.stop());
                    });
                }).catch(e => alert("Mic error: " + e.message));
            } else { mediaRecorder.stop(); isRecording = false; btn.classList.remove('recording'); btn.innerText = '🎤'; }
        }

        function openLightbox(src) {
            document.getElementById('lightbox-img').src = src;
            document.getElementById('lb-download').href = src;
            document.getElementById('lb-download').download = "7marutham_HD_photo_" + Date.now() + ".jpg";
            document.getElementById('lightbox').classList.add('active');
        }
    </script>
</body>
