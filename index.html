<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Study Portal - by Vishnuram</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        /* 🎨 CORE VARIABLES (CLEAN & STABLE) */
        :root {
            --bg-main: #202225;
            --bg-panel: #2f3136;
            --bg-sidebar: #202225;
            --text-main: #dcddde;
            --text-sub: #8e9297;
            --border-color: #202225;
            --accent: #5865F2;
            --accent-hover: #4752c4;
            --msg-me: #5865F2;
            --msg-me-text: #ffffff;
            --msg-other: #36393f;
            --input-bg: #40444b;
        }

        /* 🌈 RGB OWNER TEXT */
        @keyframes rainbow { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
        .owner-rgb {
            background: linear-gradient(90deg, #ff4757, #ffa502, #2ed573, #1e90ff, #9c88ff, #ff4757);
            background-size: 200% auto; color: #fff; background-clip: text;
            -webkit-text-fill-color: transparent; -webkit-background-clip: text;
            animation: rainbow 3s linear infinite; font-weight: 900 !important;
        }

        /* 🧱 INDESTRUCTIBLE LAYOUT FOUNDATION */
        html, body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            margin: 0; padding: 0; width: 100vw; height: 100dvh; /* 100dvh fixes mobile browser bars */
            background: var(--bg-main); color: var(--text-main); 
            overflow: hidden; display: flex; flex-direction: column;
        }
        * { box-sizing: border-box; }

        /* 📱 FULL-SCREEN OVERLAYS (Stealth, Login, Modals) */
        .fullscreen-overlay { position: fixed; inset: 0; background: var(--bg-main); z-index: 99999; display: flex; align-items: center; justify-content: center; flex-direction: column;}
        .modal-screen { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.8); display: none; align-items: center; justify-content: center; z-index: 50000; padding: 15px;}
        .modal-box { background: var(--bg-panel); padding: 25px; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); max-height: 90vh; overflow-y: auto;}
        
        .input-group { margin-bottom: 15px; width: 100%;}
        .input-group label { display: block; font-size: 12px; color: var(--text-sub); margin-bottom: 5px; font-weight: bold; text-transform: uppercase;}
        .input-style { width: 100%; padding: 14px; border-radius: 8px; border: none; background: var(--input-bg); color: white; font-size: 14px; outline: none; transition: 0.2s;}
        .input-style:focus { box-shadow: 0 0 0 2px var(--accent); }
        .btn-primary { background: var(--accent); color: white; border: none; padding: 14px; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; width: 100%; margin-top: 10px;}
        .btn-secondary { background: transparent; color: #ff4757; border: 1px solid #ff4757; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px;}

        /* 🖥️ MAIN APP LAYOUT */
        #app-screen { display: none; flex: 1; flex-direction: row; width: 100%; overflow: hidden; position: relative; }
        
        /* SIDEBAR */
        .sidebar-overlay { display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.6); z-index: 999;}
        .sidebar { width: 300px; background: var(--bg-sidebar); display: flex; flex-direction: column; border-right: 1px solid var(--border-color); z-index: 1000; flex-shrink: 0;}
        .sidebar-header { padding: 15px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; background: var(--bg-panel);}
        
        /* STATUS BAR (TOP OF SIDEBAR) */
        .status-feed { display: flex; overflow-x: auto; padding: 15px; gap: 12px; border-bottom: 1px solid var(--border-color); background: var(--bg-panel); flex-shrink: 0; scrollbar-width: none;}
        .status-item { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; flex-shrink: 0;}
        .status-ring { width: 48px; height: 48px; border-radius: 50%; padding: 2px; background: linear-gradient(45deg, #ff4757, #5865F2); display: flex; align-items: center; justify-content: center;}
        .status-img { width: 100%; height: 100%; border-radius: 50%; border: 2px solid var(--bg-panel); object-fit: cover; background: var(--input-bg); color: white; display: flex; align-items: center; justify-content: center; font-weight: bold;}
        .status-name { font-size: 10px; font-weight: bold; color: var(--text-main); max-width: 50px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;}

        .user-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 5px;}
        .user-item { display: flex; align-items: center; padding: 8px 10px; border-radius: 8px; cursor:pointer;}
        .user-item:hover { background: var(--input-bg); }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: white; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: bold; object-fit: cover; flex-shrink: 0; margin-right: 12px;}
        
        /* CHAT AREA */
        .chat-section { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg-panel); position: relative;}
        .chat-header { padding: 12px 20px; background: var(--bg-sidebar); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 15px; flex-shrink: 0;}
        .menu-btn { display: none; font-size: 24px; cursor: pointer; background: transparent; border: none; color: white;}
        
        .messages-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;}
        .discord-msg-row { display: flex; flex-direction: row; gap: 12px; max-width: 90%; }
        .discord-msg-row.me { align-self: flex-end; flex-direction: row-reverse; }
        .msg-bubble { background: var(--msg-other); padding: 10px 15px; border-radius: 12px; border-top-left-radius: 2px; color: var(--text-main); font-size: 15px; line-height: 1.4; word-break: break-word;}
        .discord-msg-row.me .msg-bubble { background: var(--msg-me); color: white; border-top-left-radius: 12px; border-top-right-radius: 2px;}
        .msg-name { font-size: 13px; font-weight: 800; margin-bottom: 4px;}
        .discord-msg-row.me .msg-name { text-align: right; }

        /* INPUT BAR (FLEX-SHRINK FIXES SQUISHING) */
        .input-bar { padding: 12px 15px; background: var(--bg-sidebar); display: flex; gap: 8px; align-items: center; flex-shrink: 0; padding-bottom: max(12px, env(safe-area-inset-bottom));}
        .action-btn { width: 40px; height: 40px; min-width: 40px; border-radius: 50%; background: var(--input-bg); color: var(--text-main); border: none; font-size: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;}
        .chat-input { flex: 1; min-width: 0; height: 40px; border-radius: 20px; background: var(--input-bg); border: none; padding: 0 15px; color: white; font-size: 15px; outline: none;}
        .send-btn { width: 40px; height: 40px; min-width: 40px; border-radius: 50%; background: var(--accent); color: white; border: none; font-size: 16px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;}

        /* UTILITIES */
        .msg-image { max-width: 200px; border-radius: 8px; margin-top: 5px; cursor: pointer;}
        audio { height: 35px; max-width: 200px; margin-top: 5px;}
        .sys-msg { align-self: center; background: var(--input-bg); padding: 5px 15px; border-radius: 15px; font-size: 11px; font-weight: bold; color: var(--text-sub); margin: 10px 0;}

        /* MOBILE FIXES */
        @media (max-width: 768px) {
            .sidebar { position: absolute; height: 100%; transform: translateX(-100%); transition: transform 0.3s ease; box-shadow: 5px 0 15px rgba(0,0,0,0.5);}
            .sidebar.open { transform: translateX(0); }
            .menu-btn { display: block; }
            .discord-msg-row { max-width: 95%; }
        }

        /* MEDIA VIEWER */
        #media-viewer { position: fixed; inset: 0; background: #000; z-index: 999999; display: none; flex-direction: column; align-items: center; justify-content: center;}
        #media-video, #media-image { max-width: 100vw; max-height: 100dvh; object-fit: contain; }
    </style>
</head>
<body>

    <audio id="sound-send" src="https://www.myinstants.com/media/sounds/pop_drip.mp3"></audio>
    <audio id="sound-receive" src="https://www.myinstants.com/media/sounds/discord-notification.mp3"></audio>

    <input type="file" id="image-picker" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
    <input type="file" id="status-uploader" accept="image/*,video/mp4" style="display: none;" onchange="handleStatusUpload(event)">

    <div id="stealth-screen" class="fullscreen-overlay">
        <div class="modal-box">
            <h2 style="margin-bottom: 5px;">Study Portal</h2>
            <p style="text-align: center; color: var(--text-sub); margin-bottom: 20px;">Enter access code.</p>
            <input type="password" id="stealth-pin" class="input-style" placeholder="****" maxlength="4" style="text-align: center; letter-spacing: 5px; font-size: 20px;">
            <button class="btn-primary" onclick="checkStealth()">Access</button>
        </div>
    </div>

    <div id="login-screen" class="fullscreen-overlay" style="display: none;">
        <div class="modal-box">
            <h2>Gamer Login</h2>
            <div class="tab-container">
                <button id="tab-login" class="tab active" onclick="switchAuthTab('login')">Login</button>
                <button id="tab-signup" class="tab" onclick="switchAuthTab('signup')">Sign Up</button>
            </div>
            <div id="form-login">
                <div class="input-group"><label>Gamer Tag</label><input type="text" id="logName" class="input-style" placeholder="Username"></div>
                <div class="input-group"><label>Password</label><input type="password" id="logPwd" class="input-style" placeholder="Password"></div>
                <button class="btn-primary" onclick="doLogin()">Login</button>
            </div>
            <div id="form-signup" style="display:none;">
                <div class="input-group"><label>Gamer Tag</label><input type="text" id="regName" class="input-style" placeholder="Username"></div>
                <div class="input-group"><label>Password</label><input type="password" id="regPwd" class="input-style" placeholder="Password"></div>
                <button class="btn-primary" style="background:#3ba55c;" onclick="doSignUp()">Create Account</button>
            </div>
        </div>
    </div>

    <div id="edit-screen" class="modal-screen">
        <div class="modal-box">
            <h2>⚙️ Edit Profile</h2>
            <div class="input-group">
                <label>Name Color (Glow)</label>
                <input type="color" id="editNameColor" class="input-style" style="padding: 2px; height: 40px; cursor: pointer;">
            </div>
            <div style="display:flex; gap:10px;">
                <div class="input-group"><label>Roblox</label><input type="text" id="editRoblox" class="input-style" placeholder="Username"></div>
                <div class="input-group"><label>Minecraft</label><input type="text" id="editMinecraft" class="input-style" placeholder="Username"></div>
            </div>
            <button class="btn-primary" onclick="saveProfile()">Save Profile</button>
            <button class="btn-secondary" onclick="document.getElementById('edit-screen').style.display='none'">Cancel</button>
        </div>
    </div>

    <div id="media-viewer">
        <button onclick="closeMedia()" style="position:absolute; top:20px; right:20px; z-index:99; background:rgba(255,255,255,0.2); border:none; color:white; width:40px; height:40px; border-radius:50%; font-size:20px; cursor:pointer;">✕</button>
        <img id="media-image" src="" style="display:none;">
        <video id="media-video" playsinline controls style="display:none;"></video>
    </div>

    <div id="app-screen">
        <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>
        
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div style="font-weight: 900; font-size: 20px; color: white;">Gamers</div>
                <div class="header-actions">
                    <button class="icon-btn-small" onclick="openEditProfile()">⚙️</button>
                </div>
            </div>

            <div class="status-feed">
                <div class="status-item" onclick="document.getElementById('status-uploader').click()">
                    <div class="status-ring" style="background: var(--input-bg); border: 2px dashed var(--text-sub);">
                        <div class="status-img" style="background: transparent;">+</div>
                    </div>
                    <div class="status-name">Add</div>
                </div>
                <div id="active-statuses" style="display: flex; gap: 12px;"></div>
            </div>

            <div class="user-list" id="users-container"></div>
            
            <div style="padding:15px; background: var(--bg-panel); border-top: 1px solid var(--border-color);">
                <button onclick="nukeChat()" style="width:100%; padding:12px; background:#ed4245; color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer; margin-bottom: 8px;">☢️ Clear Database</button>
                <button onclick="logoutApp()" style="width:100%; padding:12px; background:transparent; border:1px solid #ed4245; color:#ed4245; border-radius:8px; font-weight:bold; cursor:pointer;">🚪 Logout</button>
            </div>
        </div>

        <div class="chat-section">
            <div class="chat-header">
                <button class="menu-btn" onclick="toggleSidebar()">☰</button>
                <div style="flex:1;">
                    <div style="font-weight:900; font-size:18px; color:white;"># general</div>
                    <div style="font-size:12px; color:var(--text-sub); font-weight:bold;">Owner: Vishnuram by Vishnuram</div>
                </div>
                <div style="display:flex; align-items:center; gap:8px;">
                    <div style="background:#5865F2; padding:6px; border-radius:6px; cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center;" title="Group Call" onclick="alert('Calls loading...')">📞</div>
                </div>
            </div>

            <div class="messages-container" id="messages">
                <div class="sys-msg">Welcome to the server.</div>
            </div>

            <div class="input-bar">
                <button class="action-btn" onclick="document.getElementById('image-picker').click()">📎</button>
                <button class="action-btn" onclick="sendMsgToDB('text', `🎲 Rolled a ${Math.floor(Math.random() * 6) + 1}!`);">🎲</button>
                <input type="text" id="chatInput" class="chat-input" placeholder="Message #general..." oninput="handleTypingInput()">
                <button class="send-btn" id="action-btn" onclick="handleActionClick()">🎤</button>
            </div>
        </div>
    </div>

    <script>
        // 🔑 FIREBASE CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyARYTP4FmIXEcCS3asAKo8xgE0h2jbzZsc",
            authDomain: "marutham-17a59.firebaseapp.com",
            databaseURL: "https://marutham-17a59-default-rtdb.firebaseio.com",
            projectId: "marutham-17a59",
            storageBucket: "marutham-17a59.firebasestorage.app",
            messagingSenderId: "615501973443",
            appId: "1:615501973443:web:59d99f46d7d586287e9f76"
        };
        firebase.initializeApp(firebaseConfig);
        window.db = firebase.database();

        let myProfile = null;
        let classmates = {};
        let isOwner = false;
        window.allStatuses = {}; 
        window.allMessages = {}; 

        function playSound(type) {
            try {
                if(type === 'send') document.getElementById('sound-send').play().catch(()=>{});
                if(type === 'receive') document.getElementById('sound-receive').play().catch(()=>{});
            } catch(e) {}
        }

        // STEALTH & BOOT
        document.getElementById('stealth-pin').addEventListener('keypress', function (e) { if (e.key === 'Enter') checkStealth(); });
        function checkStealth() {
            if(document.getElementById('stealth-pin').value === '0000') { 
                document.getElementById('stealth-screen').style.display = 'none'; initAppCheck(); 
            } else { document.getElementById('stealth-pin').value = ''; }
        }

        function initAppCheck() {
            const saved = localStorage.getItem('school_user');
            if (saved) { 
                myProfile = JSON.parse(saved); 
                if(!myProfile.nameColor) myProfile.nameColor = "#ffffff";
                if(!myProfile.password) { localStorage.clear(); document.getElementById('login-screen').style.display = 'flex'; return; }
                isOwner = myProfile.name.toLowerCase().includes('vishnuram');
                startApp(); 
            } else { document.getElementById('login-screen').style.display = 'flex'; }
        }

        function switchAuthTab(tab) {
            document.getElementById('tab-login').classList.remove('active'); document.getElementById('tab-signup').classList.remove('active');
            document.getElementById('form-login').style.display = 'none'; document.getElementById('form-signup').style.display = 'none';
            document.getElementById('tab-' + tab).classList.add('active'); document.getElementById('form-' + tab).style.display = 'block';
        }

        function formatKey(name) { return name.toLowerCase().replace(/[^a-z0-9]/g, ''); }

        function doSignUp() {
            const name = document.getElementById('regName').value.trim(); const pwd = document.getElementById('regPwd').value;
            if(!name || !pwd) return alert("Fill all fields!");
            const safeKey = formatKey(name);
            db.ref('accounts/' + safeKey).once('value').then(snap => {
                if(snap.exists()) alert("Username taken!");
                else {
                    let role = name.toLowerCase().includes('vishnuram') ? 'owner' : 'user';
                    myProfile = { id: safeKey, name: name, role: role, password: pwd, nameColor: "#ffffff", avatar: "" };
                    db.ref('accounts/' + safeKey).set(myProfile);
                    localStorage.setItem('school_user', JSON.stringify(myProfile));
                    isOwner = role === 'owner'; startApp();
                }
            });
        }

        function doLogin() {
            const name = document.getElementById('logName').value.trim(); const pwd = document.getElementById('logPwd').value;
            db.ref('accounts/' + formatKey(name)).once('value').then(snap => {
                if(snap.exists() && snap.val().password === pwd) {
                    myProfile = snap.val();
                    if(!myProfile.nameColor) myProfile.nameColor = "#ffffff";
                    localStorage.setItem('school_user', JSON.stringify(myProfile));
                    isOwner = myProfile.role === 'owner'; startApp();
                } else { alert("Incorrect details."); }
            });
        }
        
        function logoutApp() {
            db.ref('users/' + myProfile.id).update({ online: false });
            localStorage.removeItem('school_user'); location.reload();
        }

        // EDIT PROFILE
        function openEditProfile() {
            document.getElementById('editNameColor').value = myProfile.nameColor || '#ffffff';
            document.getElementById('editRoblox').value = myProfile.roblox || '';
            document.getElementById('editMinecraft').value = myProfile.minecraft || '';
            document.getElementById('edit-screen').style.display = 'flex';
        }

        function saveProfile() {
            myProfile.nameColor = document.getElementById('editNameColor').value;
            myProfile.roblox = document.getElementById('editRoblox').value.trim();
            myProfile.minecraft = document.getElementById('editMinecraft').value.trim();
            let newPwd = document.getElementById('editPassword').value.trim();
            if(newPwd !== "") myProfile.password = newPwd;

            localStorage.setItem('school_user', JSON.stringify(myProfile));
            let updates = { nameColor: myProfile.nameColor, roblox: myProfile.roblox, minecraft: myProfile.minecraft };
            if(newPwd !== "") updates.password = newPwd;
            db.ref('accounts/' + myProfile.id).update(updates);
            db.ref('users/' + myProfile.id).update(updates);
            document.getElementById('edit-screen').style.display = 'none';
        }

        function toggleSidebar() { 
            const s = document.getElementById('sidebar'); const o = document.getElementById('sidebar-overlay');
            s.classList.toggle('open'); o.style.display = s.classList.contains('open') ? 'block' : 'none';
        }

        function nukeChat() { 
            if(confirm("Clear Database?")) { 
                db.ref('messages').remove(); 
                document.getElementById('messages').innerHTML = '<div class="sys-msg">🧹 Database wiped by Owner.</div>'; 
            } 
        }

        function startApp() {
            document.getElementById('login-screen').style.display = 'none'; document.getElementById('app-screen').style.display = 'flex';
            db.ref('users/' + myProfile.id).set({ ...myProfile, online: true });

            db.ref('statuses').on('value', (snap) => {
                window.allStatuses = snap.val() || {}; renderStatusBar();
            });

            db.ref('users').on('value', (snapshot) => {
                classmates = snapshot.val() || {}; renderUserList(); renderStatusBar();
            });

            db.ref('messages').on('value', (snap) => {
                if(!snap.exists()) { document.getElementById('messages').innerHTML = '<div class="sys-msg">🧹 Chat is clear.</div>'; }
            });

            let initialLoad = true;
            db.ref('messages').once('value').then(() => { initialLoad = false; }); 
            db.ref('messages').on('child_added', (snapshot) => { 
                const data = snapshot.val(); 
                if(data) { renderMessage(data); if(!initialLoad && data.sender.id !== myProfile.id) playSound('receive'); }
            });
        }

        function renderStatusBar() {
            const container = document.getElementById('active-statuses'); container.innerHTML = '';
            for(let id in window.allStatuses) {
                const u = classmates[id] || myProfile; const initial = u.name ? u.name.charAt(0).toUpperCase() : '?';
                container.innerHTML += `<div class="status-item" onclick="openStatus('${id}')"><div class="status-ring"><div class="status-img">${initial}</div></div><div class="status-name">${u.name}</div></div>`;
            }
        }

        function renderUserList() {
            const container = document.getElementById('users-container'); container.innerHTML = ''; 
            Object.keys(classmates).forEach(id => {
                const u = classmates[id]; if(!u || !u.name) return; 
                const initial = u.name.charAt(0).toUpperCase();
                let roleBadge = u.name.toLowerCase().includes('vishnuram') ? '👑' : '';
                let nameClass = u.name.toLowerCase().includes('vishnuram') ? 'name-text owner-rgb' : 'name-text';
                container.innerHTML += `<div class="user-item"><div class="avatar">${initial}</div><div><div class="${nameClass}" style="color:${u.nameColor||'white'}">${u.name} ${roleBadge}</div></div></div>`;
            });
        }

        function handleTypingInput() {
            const text = document.getElementById('chatInput').value.trim(); const btn = document.getElementById('action-btn');
            if (text) { btn.innerText = '➤'; btn.style.background = 'var(--accent)'; btn.style.color = 'white';} 
            else { btn.innerText = '🎤'; btn.style.background = 'var(--input-bg)'; btn.style.color = 'var(--text-main)';}
        }

        function handleActionClick() {
            const text = document.getElementById('chatInput').value.trim();
            if (text) {
                if(text.startsWith('/clear')) { document.getElementById('messages').innerHTML = '<div class="sys-msg">🧹 Screen cleared.</div>'; document.getElementById('chatInput').value=''; return; }
                sendMsgToDB('text', text); document.getElementById('chatInput').value = ''; handleTypingInput(); 
            } else { toggleVoiceRecord(); }
        }

        function sendMsgToDB(msgType, msgContent, receiverId = null, base64Data = null) {
            playSound('send');
            const msgId = 'msg_' + Date.now();
            let safeSenderData = { id: myProfile.id, name: myProfile.name, nameColor: myProfile.nameColor || '#fff' };
            let payload = { msgId: msgId, sender: safeSenderData, type: msgType, text: msgContent, data: base64Data, time: new Date().toLocaleTimeString() };
            db.ref('messages/' + msgId).set(payload); 
        }
        document.getElementById('chatInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') handleActionClick(); });

        // IMAGE UPLOAD
        function compressImage(file, maxRes, callback) {
            const reader = new FileReader();
            reader.onload = function(evt) {
                const img = new Image(); img.onload = function() {
                    const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
                    let w = img.width, h = img.height; 
                    if(w > h) { if(w > maxRes) { h *= maxRes/w; w = maxRes; } } else { if(h > maxRes) { w *= maxRes/h; h = maxRes; } }
                    canvas.width = w; canvas.height = h; ctx.drawImage(img, 0, 0, w, h); callback(canvas.toDataURL('image/jpeg', 0.6));
                }; img.src = evt.target.result;
            }; reader.readAsDataURL(file);
        }
        function handleImageUpload(e) {
            if(!e.target.files[0]) return; document.getElementById('chatInput').placeholder = "Uploading image...";
            compressImage(e.target.files[0], 600, (base64) => { sendMsgToDB('image', '', null, base64); document.getElementById('chatInput').placeholder = "Message #general..."; });
            e.target.value = '';
        }

        // VOICE RECORD
        let isRecording = false; let mediaRecorder; let audioChunks = [];
        function toggleVoiceRecord() {
            const btn = document.getElementById('action-btn');
            if(!isRecording) {
                navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                    mediaRecorder = new MediaRecorder(stream); mediaRecorder.start(); isRecording = true; 
                    btn.innerText = '⏹'; btn.style.background = '#ff4757'; btn.style.color = "white"; audioChunks = [];
                    mediaRecorder.addEventListener("dataavailable", e => { audioChunks.push(e.data); });
                    mediaRecorder.addEventListener("stop", () => {
                        const blob = new Blob(audioChunks); const reader = new FileReader(); reader.readAsDataURL(blob);
                        reader.onloadend = () => { sendMsgToDB('voice', '', null, reader.result); }; stream.getTracks().forEach(t => t.stop());
                    });
                }).catch(e => alert("Mic error: " + e.message));
            } else { mediaRecorder.stop(); isRecording = false; btn.innerText = '🎤'; btn.style.background = 'var(--input-bg)'; btn.style.color = "var(--text-main)"; }
        }

        // STATUS UPLOAD
        function handleStatusUpload(e) {
            const file = e.target.files[0]; if(!file) return;
            if(file.type.startsWith('video/')) {
                const reader = new FileReader(); reader.onload = (evt) => { db.ref('statuses/' + myProfile.id).set({ type: 'video', data: evt.target.result, timestamp: Date.now() }); alert("Status uploaded!"); }; reader.readAsDataURL(file);
            } else { compressImage(file, 800, (base64) => { db.ref('statuses/' + myProfile.id).set({ type: 'image', data: base64, timestamp: Date.now() }); alert("Status uploaded!"); }); }
            e.target.value = '';
        }
        function openStatus(userId) {
            const s = window.allStatuses[userId]; if(!s) return;
            const imgEl = document.getElementById('media-image'); const vidEl = document.getElementById('media-video');
            document.getElementById('media-viewer').style.display = 'flex';
            if(s.type === 'video') { imgEl.style.display = 'none'; vidEl.src = s.data; vidEl.style.display = 'block'; vidEl.controls = true; vidEl.play();} 
            else { vidEl.style.display = 'none'; vidEl.pause(); imgEl.src = s.data; imgEl.style.display = 'block'; }
        }
        function closeMedia() { document.getElementById('media-viewer').style.display = 'none'; const vidEl = document.getElementById('media-video'); vidEl.pause(); vidEl.src = ""; }

        function createMessageHTML(payload) {
            const sId = payload.sender.id || 'unknown'; const sName = payload.sender.name || 'Unknown';
            const sColor = payload.sender.nameColor || 'var(--text-main)';
            const isMe = sId === myProfile.id; let bodyHtml = '';
            
            if(payload.type === 'text') bodyHtml = payload.text;
            else if (payload.type === 'image') bodyHtml = `<img src="${payload.data}" class="msg-image" onclick="document.getElementById('lightbox-img').src='${payload.data}'; document.getElementById('lightbox').classList.add('active');">`;
            else if (payload.type === 'voice') bodyHtml = `<audio controls src="${payload.data}"></audio>`;

            let nameClass = sName.toLowerCase().includes('vishnuram') ? 'msg-name owner-rgb' : 'msg-name';
            let rowClass = `discord-msg-row ${isMe ? 'me' : ''}`;

            return `
                <div class="${rowClass}" id="${payload.msgId}">
                    <div class="msg-bubble">
                        <div class="${nameClass}" style="color:${sColor};">${sName}</div>
                        <div>${bodyHtml}</div>
                        <div style="font-size:9px; opacity:0.5; margin-top:4px; text-align:${isMe?'right':'left'}">${payload.time}</div>
                    </div>
                </div>`;
        }

        function renderMessage(payload) {
            const container = document.getElementById('messages');
            const isAtBottom = container.scrollHeight - container.scrollTop <= container.clientHeight + 100;
            if (!document.getElementById(payload.msgId)) { container.insertAdjacentHTML('beforeend', createMessageHTML(payload)); if (isAtBottom || payload.sender.id === myProfile.id) container.scrollTop = container.scrollHeight; }
        }
    </script>
</body>
</html>
