<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gaming Club - by Vishnuram</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        /* 🎨 ZERO-LAG CORE VARIABLES */
        :root {
            --bg-main: #202225;
            --bg-panel: #2f3136;
            --bg-sidebar: #202225;
            --text-main: #dcddde;
            --text-sub: #8e9297;
            --border-color: #202225;
            --accent: #5865F2;
            --accent-hover: #4752c4;
            --input-bg: #40444b;
            --danger: #ed4245;
            --success: #57F287;
            --warning: #fee75c;
        }

        html, body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            margin: 0; padding: 0; width: 100vw; height: 100dvh; 
            background: var(--bg-main); color: var(--text-main); 
            overflow: hidden; display: flex; flex-direction: column;
        }
        * { box-sizing: border-box; }

        /* 🚀 FAST CSS GAMER BACKGROUND */
        .bg-grid {
            position: fixed; inset: 0; z-index: -10;
            background-color: #18191c;
            background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        /* 🌈 RGB OWNER TEXT */
        @keyframes rainbow { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
        .owner-rgb {
            background: linear-gradient(90deg, #ff4757, #ffa502, #2ed573, #1e90ff, #9c88ff, #ff4757);
            background-size: 200% auto; color: #fff; background-clip: text;
            -webkit-text-fill-color: transparent; -webkit-background-clip: text;
            animation: rainbow 3s linear infinite; font-weight: 900 !important;
        }

        /* 📱 FULL-SCREEN OVERLAYS (Stealth, Modals) */
        .fullscreen-overlay { position: fixed; inset: 0; background: var(--bg-main); z-index: 999999; display: flex; align-items: center; justify-content: center; flex-direction: column;}
        .modal-screen { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7); display: none; align-items: center; justify-content: center; z-index: 50000; padding: 15px;}
        .modal-box { background: var(--bg-panel); padding: 25px; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); max-height: 90vh; overflow-y: auto;}
        
        .modal-box h2 { margin-top: 0; text-align: center; margin-bottom: 20px; font-weight: 900; color: white;}
        .input-group { margin-bottom: 15px; width: 100%;}
        .input-group label { display: block; font-size: 12px; color: var(--text-sub); margin-bottom: 5px; font-weight: bold; text-transform: uppercase;}
        .input-style { width: 100%; padding: 14px; border-radius: 8px; border: none; background: var(--input-bg); color: white; font-size: 14px; outline: none; transition: 0.2s;}
        .input-style:focus { box-shadow: 0 0 0 2px var(--accent); }
        input[type="color"] { padding: 2px; height: 40px; cursor: pointer; border: none; }
        
        .btn-primary { background: var(--accent); color: white; border: none; padding: 14px; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; width: 100%; margin-top: 10px; transition: 0.2s;}
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-secondary { background: transparent; color: var(--text-sub); border: 1px solid var(--text-sub); padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px;}
        .btn-danger { background: rgba(237, 66, 69, 0.1); color: var(--danger); border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; transition: 0.2s;}
        .btn-danger:hover { background: var(--danger); color: white;}

        .tab-container { display: flex; gap: 8px; margin-bottom: 20px; background: var(--bg-sidebar); padding: 6px; border-radius: 10px;}
        .tab { flex: 1; padding: 12px; border: none; background: transparent; color: var(--text-sub); border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px;}
        .tab.active { background: var(--input-bg); color: white; }

        /* 🖥️ MAIN APP LAYOUT */
        #app-screen { display: none; flex: 1; flex-direction: row; width: 100%; overflow: hidden; position: relative; }
        
        /* SIDEBAR */
        .sidebar-overlay { display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.6); z-index: 999;}
        .sidebar { width: 300px; background: var(--bg-sidebar); display: flex; flex-direction: column; border-right: 1px solid var(--border-color); z-index: 1000; flex-shrink: 0;}
        .sidebar-header { padding: 15px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; background: var(--bg-panel);}
        
        /* 📸 STATUS BAR */
        .status-feed { display: flex; overflow-x: auto; padding: 15px; gap: 12px; border-bottom: 1px solid var(--border-color); background: var(--bg-panel); flex-shrink: 0; scrollbar-width: none;}
        .status-feed::-webkit-scrollbar { display: none; }
        .status-item { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; flex-shrink: 0; transition: 0.2s;}
        .status-item:hover { transform: scale(1.05); }
        .status-ring { width: 48px; height: 48px; border-radius: 50%; padding: 2px; background: linear-gradient(45deg, #ff4757, var(--accent)); display: flex; align-items: center; justify-content: center;}
        .status-img { width: 100%; height: 100%; border-radius: 50%; border: 2px solid var(--bg-panel); object-fit: cover; background: var(--input-bg); color: white; display: flex; align-items: center; justify-content: center; font-weight: bold;}
        .status-name { font-size: 10px; font-weight: bold; color: var(--text-main); max-width: 50px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;}

        .user-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 5px;}
        .user-item { display: flex; align-items: center; padding: 8px 10px; border-radius: 8px; cursor:pointer; transition: 0.1s;}
        .user-item:hover { background: var(--bg-panel); }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: white; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: bold; object-fit: cover; flex-shrink: 0; margin-right: 12px;}
        .avatar.has-status { border: 2px solid var(--success); padding: 2px; background-clip: content-box; }
        
        .user-details { flex: 1; min-width: 0; display: flex; flex-direction: column;}
        .name-text { font-weight: bold; font-size: 15px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 5px;}

        /* CHAT AREA */
        .chat-section { flex: 1; display: flex; flex-direction: column; min-width: 0; background: transparent; position: relative;}
        .chat-header { padding: 12px 20px; background: var(--bg-panel); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 15px; flex-shrink: 0; box-shadow: 0 2px 5px rgba(0,0,0,0.1); z-index: 10;}
        .menu-btn { display: none; font-size: 24px; cursor: pointer; background: transparent; border: none; color: white;}
        
        .header-info { flex: 1; display: flex; justify-content: space-between; align-items: center; min-width: 0;}
        .header-title { font-weight: 900; font-size: 18px; color: white; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        
        /* 🟢 MULTI-SELECT BAR */
        #multi-select-bar { display: none; position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: var(--bg-panel); border: 2px solid var(--danger); border-radius: 12px; padding: 10px 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 2000; align-items: center; gap: 15px;}
        
        .messages-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth;}
        
        .discord-msg-row { display: flex; flex-direction: row; gap: 12px; max-width: 90%; position: relative; padding: 4px 8px; border-radius: 8px;}
        .discord-msg-row:hover { background: rgba(255,255,255,0.02); }
        .discord-msg-row.me { align-self: flex-end; flex-direction: row-reverse; }
        .discord-msg-row.selected { background: rgba(237, 66, 69, 0.1); border-left: 3px solid var(--danger); }
        
        .msg-checkbox { display: none; margin-top: 10px; width: 18px; height: 18px; accent-color: var(--danger); flex-shrink: 0; cursor: pointer;}
        .select-mode-active .msg-checkbox { display: block; }

        .msg-bubble { background: var(--bg-panel); padding: 12px 16px; border-radius: 12px; border-top-left-radius: 2px; color: var(--text-main); font-size: 15px; line-height: 1.4; word-break: break-word; box-shadow: 0 2px 5px rgba(0,0,0,0.1); position: relative;}
        .discord-msg-row.me .msg-bubble { background: var(--accent); color: white; border-top-left-radius: 12px; border-top-right-radius: 2px;}
        .msg-name { font-size: 14px; font-weight: 800; margin-bottom: 4px; cursor: pointer;}
        .msg-name:hover { text-decoration: underline; }
        .discord-msg-row.me .msg-name { text-align: right; }

        .msg-actions { opacity: 0; position: absolute; top: -10px; right: 15px; display: flex; background: var(--bg-sidebar); border: 1px solid var(--border-color); border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); overflow: hidden; z-index: 10;}
        .discord-msg-row:hover .msg-actions { opacity: 1; }
        .select-mode-active .msg-actions { display: none !important; }
        .action-icon-btn { background: transparent; border: none; border-right: 1px solid var(--border-color); color: var(--text-sub); font-size: 14px; cursor: pointer; padding: 6px 10px;}
        .action-icon-btn:hover { background: var(--input-bg); color: white;}

        /* 📞 CALL MODAL */
        .call-user-item { display: flex; align-items: center; gap: 10px; background: var(--input-bg); padding: 10px; border-radius: 12px; margin-bottom: 8px;}
        .call-action-btn { background: var(--input-bg); color: white; border: none; font-size: 22px; cursor: pointer; width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: 0.2s;}
        .call-action-btn.mute.active { background: white; color: var(--bg-panel); }
        .call-action-btn.end { background: var(--danger); }

        /* 🛠️ IRON-CLAD INPUT BAR */
        .input-bar { padding: 12px 15px; background: var(--bg-panel); display: flex; gap: 8px; align-items: center; flex-shrink: 0; padding-bottom: max(12px, env(safe-area-inset-bottom)); border-top: 1px solid var(--border-color);}
        .action-btn { width: 44px; height: 44px; min-width: 44px; min-height: 44px; border-radius: 50%; background: var(--input-bg); color: var(--text-main); border: none; font-size: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; transition: 0.2s;}
        .action-btn:hover { background: var(--accent); color: white; }
        .chat-input { flex: 1; min-width: 0; height: 44px; border-radius: 22px; background: var(--input-bg); border: none; padding: 0 15px; color: white; font-size: 15px; outline: none;}
        .send-btn { width: 44px; height: 44px; min-width: 44px; min-height: 44px; border-radius: 50%; background: var(--accent); color: white; border: none; font-size: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; transition: 0.2s;}

        .msg-image { max-width: 250px; border-radius: 8px; margin-top: 5px; cursor: pointer;}
        audio { height: 40px; max-width: 220px; margin-top: 5px;}
        .sys-msg { align-self: center; background: var(--input-bg); padding: 6px 16px; border-radius: 16px; font-size: 12px; font-weight: bold; color: var(--text-sub); margin: 10px 0;}

        /* MEDIA VIEWER */
        #media-viewer { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 999999; display: none; flex-direction: column; align-items: center; justify-content: center;}
        #media-video, #media-image { max-width: 100vw; max-height: 100dvh; object-fit: contain; }

        @media (max-width: 768px) {
            .sidebar { position: absolute; height: 100%; transform: translateX(-100%); transition: transform 0.3s ease; box-shadow: 5px 0 15px rgba(0,0,0,0.5);}
            .sidebar.open { transform: translateX(0); }
            .menu-btn { display: block; }
            .close-sidebar-btn { display: block; background: transparent; border: none; color: var(--text-sub); font-size: 20px;}
            .discord-msg-row { max-width: 95%; }
            .msg-actions { position: relative; top: 0; right: 0; opacity: 1; display: inline-flex; border: none; box-shadow: none; background: transparent; margin-top: 5px;}
            .action-icon-btn { background: var(--input-bg); margin-right: 5px; border-radius: 6px; padding: 4px 8px;}
        }
    </style>
</head>
<body>

    <audio id="sound-send" src="https://www.myinstants.com/media/sounds/pop_drip.mp3"></audio>
    <audio id="sound-receive" src="https://www.myinstants.com/media/sounds/discord-notification.mp3"></audio>

    <div class="bg-grid"></div>

    <input type="file" id="image-picker" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
    <input type="file" id="status-uploader" accept="image/*,video/mp4" style="display: none;" onchange="handleStatusUpload(event)">
    <input type="file" id="avatar-upload" accept="image/*" style="display: none;" onchange="handleAvatarSelection(event)">

    <div id="stealth-screen" class="fullscreen-overlay">
        <div class="modal-box">
            <h2 style="margin-bottom: 5px; font-size: 28px;">Study Portal</h2>
            <p style="text-align: center; color: var(--text-sub); margin-bottom: 20px; font-weight: bold;">Enter access code.</p>
            <input type="password" id="stealth-pin" class="input-style" placeholder="****" maxlength="4" style="text-align: center; letter-spacing: 5px; font-size: 24px;">
            <button class="btn-primary" onclick="checkStealth()">Access Portal</button>
        </div>
    </div>

    <div id="login-screen" class="fullscreen-overlay" style="display: none;">
        <div class="modal-box">
            <h2>Gamer Login</h2>
            <div class="tab-container">
                <button id="tab-login" class="tab active" onclick="switchAuthTab('login')">Login</button>
                <button id="tab-signup" class="tab" onclick="switchAuthTab('signup')">Sign Up</button>
            </div>
            <div id="form-login">
                <div class="input-group"><label>Gamer Tag</label><input type="text" id="logName" class="input-style" placeholder="Username"></div>
                <div class="input-group"><label>Password</label><input type="password" id="logPwd" class="input-style" placeholder="Password"></div>
                <button class="btn-primary" onclick="doLogin()">Login</button>
            </div>
            <div id="form-signup" style="display:none;">
                <div class="input-group"><label>New Gamer Tag</label><input type="text" id="regName" class="input-style" placeholder="Create username"></div>
                <div class="input-group"><label>Create Password</label><input type="password" id="regPwd" class="input-style" placeholder="Password"></div>
                <button class="btn-primary" style="background:var(--success); color:#000;" onclick="doSignUp()">Create Account</button>
            </div>
        </div>
    </div>

    <div id="edit-screen" class="modal-screen">
        <div class="modal-box">
            <h2>⚙️ Edit Profile</h2>
            
            <div class="input-group">
                <label>Profile Picture</label>
                <div style="display:flex; align-items:center; gap:15px; background:var(--input-bg); padding:10px; border-radius:12px;">
                    <img id="avatar-preview" src="" style="width:50px; height:50px; border-radius:12px; object-fit:cover; background:var(--accent);">
                    <button class="btn-primary" style="margin-top:0; padding:10px; font-size:12px; flex:1;" onclick="document.getElementById('avatar-upload').click()">📷 Change Image</button>
                </div>
            </div>

            <div class="input-group">
                <label>Name Color (Glow)</label>
                <input type="color" id="editNameColor" value="#ffffff">
            </div>

            <div style="display:flex; gap:10px;">
                <div class="input-group"><label>Roblox</label><input type="text" id="editRoblox" class="input-style" placeholder="Username"></div>
                <div class="input-group"><label>Minecraft</label><input type="text" id="editMinecraft" class="input-style" placeholder="Username"></div>
            </div>

            <div class="input-group">
                <label>Change Password (Optional)</label>
                <input type="password" id="editPassword" class="input-style" placeholder="New password">
            </div>

            <button class="btn-primary" onclick="saveProfile()">Save Profile</button>
            <button class="btn-secondary" style="border:none;" onclick="document.getElementById('edit-screen').style.display='none'">Cancel</button>
        </div>
    </div>

    <div id="user-action-modal" class="modal-screen">
        <div class="modal-box" style="padding: 20px;">
            <div style="display:flex; align-items:center; gap: 15px; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px;">
                <img id="action-avatar" src="" style="width:65px; height:65px; border-radius:16px; object-fit:cover; background:var(--accent); display:none;">
                <div id="action-avatar-text" style="width:65px; height:65px; border-radius:16px; background:var(--accent); color:white; display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:bold;"></div>
                <div>
                    <h3 id="action-name" style="margin:0; font-size:22px;">Name</h3>
                    <p id="action-role" style="margin:0; font-size:12px; color:var(--text-sub); font-weight:800; text-transform:uppercase;">Role</p>
                </div>
            </div>
            
            <div style="background: var(--input-bg); border-radius: 12px; padding: 15px; margin-bottom: 15px;">
                <div style="display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 8px; font-weight: bold;">
                    <span style="color: var(--text-sub);">Minecraft:</span> <div id="card-mc" style="color: white;">Not Linked</div>
                </div>
                <div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: bold;">
                    <span style="color: var(--text-sub);">Roblox:</span> <div id="card-rb" style="color: white;">Not Linked</div>
                </div>
            </div>

            <input type="hidden" id="action-target-id">
            <div id="action-buttons-container"></div>
            <button class="btn-secondary" style="border:none;" onclick="document.getElementById('user-action-modal').style.display='none'">Close</button>
        </div>
    </div>

    <div id="call-modal" class="modal-screen">
        <div class="modal-box" style="text-align: center; max-width: 320px;">
            <div style="font-size: 40px; margin-bottom: 10px;">📞</div>
            <h2 style="margin-bottom: 5px;">Group Call</h2>
            <p id="call-status" style="color: var(--success); font-weight: bold; margin-bottom: 20px;">Connected</p>
            
            <div id="call-participants" style="background: var(--input-bg); border-radius: 12px; padding: 15px; margin-bottom: 20px; max-height: 200px; overflow-y: auto;">
                </div>

            <div style="display: flex; justify-content: center; gap: 20px;">
                <button class="call-action-btn mute" id="call-mute-btn" onclick="toggleMuteCall()">🎤</button>
                <button class="call-action-btn end" onclick="endCall()">📵</button>
            </div>
        </div>
    </div>

    <div id="media-viewer">
        <div style="position: absolute; top: 20px; left: 20px; color: white; font-weight: bold; font-size: 18px; z-index: 5001;" id="media-title">Status</div>
        <button onclick="closeMedia()" style="position:absolute; top:20px; right:20px; z-index:5001; background:rgba(255,255,255,0.2); border:none; color:white; width:40px; height:40px; border-radius:50%; font-size:20px; cursor:pointer;">✕</button>
        <img id="media-image" src="" style="display:none;">
        <video id="media-video" playsinline controls style="display:none;"></video>
        <button id="status-delete-btn" style="position:absolute; bottom:30px; background:var(--danger); color:white; border:none; padding:12px 25px; border-radius:25px; font-weight:bold; cursor:pointer; display:none; z-index:5001;" onclick="ownerDeleteStatus()">🗑️ Delete</button>
    </div>

    <div id="bug-report-screen" class="modal-screen">
        <div class="modal-box">
            <h2>🐛 Report Bug</h2>
            <textarea id="bugText" class="input-style" rows="4" placeholder="Describe what went wrong..." style="resize:none; margin-bottom: 15px;"></textarea>
            <button class="btn-primary" onclick="submitBug()">Submit</button>
            <button class="btn-secondary" style="border:none;" onclick="document.getElementById('bug-report-screen').style.display='none'">Cancel</button>
        </div>
    </div>

    <div id="owner-bugs-screen" class="modal-screen">
        <div class="modal-box" style="max-width: 500px;">
            <h2>🛠️ Bug Reports</h2>
            <div id="bug-list-container" style="display:flex; flex-direction:column; gap:10px; max-height: 400px; overflow-y: auto;"></div>
            <button class="btn-secondary" style="border:none;" onclick="document.getElementById('owner-bugs-screen').style.display='none'">Close</button>
        </div>
    </div>

    <div id="app-screen">
        <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>
        
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div style="font-weight: 900; font-size: 20px; color: white;">Gamers</div>
                <div class="header-actions">
                    <button class="icon-btn-small" onclick="document.getElementById('bug-report-screen').style.display='flex'" title="Report Bug">🐛</button>
                    <button class="icon-btn-small" onclick="openEditProfile()" title="Settings">⚙️</button>
                    <button class="close-sidebar-btn" onclick="toggleSidebar()">✕</button>
                </div>
            </div>

            <div class="status-feed">
                <div class="status-item" onclick="document.getElementById('status-uploader').click()">
                    <div class="status-ring" style="background: var(--input-bg); border: 2px dashed var(--text-sub);">
                        <div class="status-img" style="background: transparent;">+</div>
                    </div>
                    <div class="status-name" style="color: var(--text-sub);">Add</div>
                </div>
                <div id="active-statuses" style="display: flex; gap: 12px;"></div>
            </div>

            <div class="user-list" id="users-container"></div>
            
            <div style="padding:15px; background: var(--bg-panel); border-top: 1px solid var(--border-color);">
                <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                    <button class="btn-secondary" style="margin:0; color:white; border-color:var(--border-color); background:var(--input-bg);" onclick="toggleSelectMode()">🗑️ Select</button>
                </div>
                
                <div id="owner-super-controls" style="display:none; flex-direction: column;">
                    <button class="btn-primary" style="margin-top:0; margin-bottom:10px; background: #9b59b6;" onclick="document.getElementById('owner-bugs-screen').style.display='flex'; loadBugs();">🛠️ View Bugs</button>
                    <button class="btn-danger" style="margin-top:0; margin-bottom:10px;" onclick="nukeChat()">☢️ Clear Chat</button>
                </div>
                <button class="btn-danger" style="margin:0; background:transparent; border: 1px solid var(--danger);" onclick="logoutApp()">🚪 Logout</button>
            </div>
        </div>

        <div class="chat-section">
            <div class="chat-header">
                <button class="menu-btn" onclick="toggleSidebar()">☰</button>
                <div class="header-info">

        // IMAGE UPLOAD
        function compressImage(file, maxRes, callback) {
            const reader = new FileReader();
            reader.onload = function(evt) {
                const img = new Image(); img.onload = function() {
                    const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
                    let w = img.width, h = img.height; 
                    if(w > h) { if(w > maxRes) { h *= maxRes/w; w = maxRes; } } else { if(h > maxRes) { w *= maxRes/h; h = maxRes; } }
                    canvas.width = w; canvas.height = h; ctx.drawImage(img, 0, 0, w, h); callback(canvas.toDataURL('image/jpeg', 0.6));
                }; img.src = evt.target.result;
            }; reader.readAsDataURL(file);
        }
        function handleImageUpload(e) {
            if(!e.target.files[0]) return; document.getElementById('chatInput').placeholder = "Uploading image...";
            compressImage(e.target.files[0], 600, (base64) => { sendMsgToDB('image', '', null, base64); document.getElementById('chatInput').placeholder = "Message #general..."; });
            e.target.value = '';
        }
        document.getElementById('chatInput').addEventListener('paste', function(e) {
            let items = e.clipboardData.items;
            for(let i=0; i<items.length; i++) {
                if(items[i].type.indexOf('image') !== -1) {
                    let blob = items[i].getAsFile(); document.getElementById('chatInput').placeholder = "Uploading image...";
                    compressImage(blob, 500, (base64) => { sendMsgToDB('image', '', null, base64); document.getElementById('chatInput').placeholder = "Message #general..."; });
                    e.preventDefault(); 
                }
            }
        });

        // VOICE RECORD
        let isRecording = false; let mediaRecorder; let audioChunks = [];
        function toggleVoiceRecord() {
            const btn = document.getElementById('action-btn');
            if(!isRecording) {
                navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                    const mimeType = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/mp4';
                    mediaRecorder = new MediaRecorder(stream, {mimeType}); mediaRecorder.start(); isRecording = true; 
                    btn.innerText = '⏹'; btn.style.background = '#ed4245'; btn.style.color = "white"; audioChunks = [];
                    mediaRecorder.addEventListener("dataavailable", e => { audioChunks.push(e.data); });
                    mediaRecorder.addEventListener("stop", () => {
                        const blob = new Blob(audioChunks, {type: mimeType}); const reader = new FileReader(); reader.readAsDataURL(blob);
                        reader.onloadend = () => { sendMsgToDB('voice', '', null, reader.result); }; stream.getTracks().forEach(t => t.stop());
                    });
                }).catch(e => alert("Mic error: " + e.message));
            } else { mediaRecorder.stop(); isRecording = false; btn.innerText = '🎤'; btn.style.background = 'var(--input-bg)'; btn.style.color = "var(--text-sub)"; }
        }

            } else { compressImage(file, 800, (base64) => { db.ref('statuses/' + myProfile.id).set({ type: 'image', data: base64, timestamp: Date.now() }); alert("Status uploaded!"); }); }
            e.target.value = '';
        }

            document.getElementById('status-delete-btn').style.display = (isOwner || userId === myProfile.id) ? 'block' : 'none';
            document.getElementById('media-title').innerText = "Status";
            
            const imgEl = document.getElementById('media-image'); const vidEl = document.getElementById('media-video');
            document.getElementById('media-viewer').style.display = 'flex';
            if(s.type === 'video') { 
                imgEl.style.display = 'none'; vidEl.src = s.data; vidEl.style.display = 'block'; vidEl.play();
                vidEl.onloadedmetadata = () => { let d = vidEl.duration * 1000; if(d > 120000) d = 120000; if(mediaTimer) clearTimeout(mediaTimer); mediaTimer = setTimeout(closeMedia, d); };
            } 
            else { 
                vidEl.style.display = 'none'; vidEl.pause(); imgEl.src = s.data; imgEl.style.display = 'block'; 
                if(mediaTimer) clearTimeout(mediaTimer); mediaTimer = setTimeout(closeMedia, 5000);
            }
        }
        function closeMedia() { document.getElementById('media-viewer').style.display = 'none'; const vidEl = document.getElementById('media-video'); vidEl.pause(); vidEl.src = ""; if(mediaTimer) clearTimeout(mediaTimer);}
        function ownerDeleteStatus() { let tId = document.getElementById('action-target-id').value; db.ref('statuses/' + tId).remove(); closeMedia(); alert("Status deleted."); }
        function deleteMessage(msgId) { db.ref('messages/' + msgId).update({ isDeleted: true }); }
        function hardDeleteMessage(msgId) { if(confirm("Erase permanently?")) db.ref('messages/' + msgId).remove(); }
        function cmdKick(id) { if(confirm("Kick?")) { db.ref('accounts/'+id).remove(); db.ref('users/'+id).remove(); closeUserActions();} }
        function cmdPromote(id) { db.ref('accounts/'+id).update({ role: 'admin' }); db.ref('users/'+id).update({ role: 'admin' }); alert("Promoted."); closeUserActions();}
        function cmdDemote(id) { db.ref('accounts/'+id).update({ role: 'user' }); db.ref('users/'+id).update({ role: 'user' }); alert("Demoted."); closeUserActions();}
        function cmdTimeout(id) { db.ref('accounts/'+id).update({ timeoutUntil: Date.now() + 300000 }); db.ref('users/'+id).update({ timeoutUntil: Date.now() + 300000 }); alert("Timed out."); closeUserActions();}

        function createMessageHTML(payload) {
            const sId = payload.sender.id || 'unknown'; const sName = payload.sender.name || 'Unknown';
            const sColor = payload.sender.nameColor || 'var(--text-main)';
            const isMe = sId === myProfile.id; let bodyHtml = '';
            
            if(payload.type === 'alert' && !payload.isDeleted) {
                const canDel = isOwner || isAdmin;
                return `<div class="sys-alert-msg" id="${payload.msgId}">
                    ${canDel ? `<button class="action-icon-btn red" style="position:absolute; top:10px; right:10px; border:none;" onclick="hardDeleteMessage('${payload.msgId}')">🗑️</button>` : ''}
                    <div class="sys-alert-title owner-rgb">🚨 ANNOUNCEMENT</div>
                    <div class="sys-alert-text">${payload.text}</div>
                </div>`;
            }

            let replyHtml = '';
            if(payload.replyTo && !payload.isDeleted) replyHtml = `<div class="reply-quote"><div class="reply-quote-name" style="color:${payload.replyTo.color || 'var(--accent)'}">${payload.replyTo.name}</div>${payload.replyTo.text}</div>`;

            if(payload.isDeleted) bodyHtml = '<span class="deleted-text">🚫 Message deleted</span>';
            else if(payload.type === 'text' || payload.type === 'dm') {
                bodyHtml = payload.text.replace(/(https?:\/\/[^\s]+)/g, url => `<a href="${url}" target="_blank">${url}</a>`);
                if(payload.type === 'dm') bodyHtml = `<div style="font-size:10px; color:var(--accent); font-weight:900; margin-bottom:6px; text-transform:uppercase;">🕵️ DM ${isMe ? 'To: Private' : `From: ${sName}`}</div>` + bodyHtml;
            }
            else if (payload.type === 'image') bodyHtml = `<img src="${payload.data}" class="msg-image" onclick="document.getElementById('lightbox-img').src='${payload.data}'; document.getElementById('lightbox').classList.add('active');">`;
            else if (payload.type === 'voice') bodyHtml = `<audio controls src="${payload.data}"></audio>`;

            let nameClass = sName.toLowerCase().includes('vishnuram') ? 'msg-name owner-rgb' : 'msg-name';
            let rowClass = `discord-msg-row ${isMe ? 'me' : ''}`;
            if(selectedMsgs.has(payload.msgId)) rowClass += " selected";

            // Local Avatar lookup
            const currentProfile = classmates[sId] || (sId === myProfile.id ? myProfile : {});
            const sAvatar = currentProfile.avatar || '';
            let hasStatusClass = window.allStatuses[sId] ? 'has-status' : '';
            let avatarHTML = (sAvatar && sAvatar.startsWith('data:image')) ? `<img src="${sAvatar}" class="avatar ${hasStatusClass}" onclick="openUserActions('${sId}')" style="cursor:pointer;">` 
                                       : `<div class="avatar ${hasStatusClass}" onclick="openUserActions('${sId}')" style="cursor:pointer;">${sName.charAt(0).toUpperCase()}</div>`;

            const checkBoxHTML = (isMe || isOwner) ? `<input type="checkbox" class="msg-checkbox" id="cb_${payload.msgId}" onclick="event.stopPropagation(); handleCheckbox(this, '${payload.msgId}')">` : '';

            const canDelete = (isMe || isOwner || isAdmin) && !payload.isDeleted;
            let hoverActions = `<div class="msg-actions">`;
            if(!payload.isDeleted) hoverActions += `<button class="action-icon-btn" onclick="setReply('${payload.msgId}')" title="Reply">↩️</button>`;
            if(canDelete) hoverActions += `<button class="action-icon-btn red" onclick="deleteMessage('${payload.msgId}')" title="Delete">🗑️</button>`;
            if(payload.isDeleted && isOwner) hoverActions += `<button class="action-icon-btn red" onclick="hardDeleteMessage('${payload.msgId}')" title="Erase Permanently">🔥</button>`;
            hoverActions += `</div>`;

            return `
                <div class="${rowClass}" id="${payload.msgId}" onclick="msgClick('${payload.msgId}', '${sId}')">
                    ${checkBoxHTML}
                    ${avatarHTML}
                    <div class="msg-bubble">
                        <div class="${nameClass}" style="color:${sColor};" onclick="openUserActions('${sId}')">${sName}</div>
                        ${replyHtml}
                        <div>${bodyHtml}</div>
                        <div style="font-size:9px; opacity:0.5; margin-top:4px; text-align:${isMe?'right':'left'}">${payload.time}</div>
                        ${hoverActions}
                    </div>
                </div>`;
        }

        function renderMessage(payload) {
            const sId = payload.sender.id || 'unknown';
            if(payload.receiverId && sId !== myProfile.id && payload.receiverId !== myProfile.id && !isOwner) return;
            const container = document.getElementById('messages');
            const isAtBottom = container.scrollHeight - container.scrollTop <= container.clientHeight + 100;
            if (!document.getElementById(payload.msgId)) { container.insertAdjacentHTML('beforeend', createMessageHTML(payload)); if (isAtBottom || sId === myProfile.id) container.scrollTop = container.scrollHeight; }
        }
    </script>
</body>
</html>
